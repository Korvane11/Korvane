<!doctype html>
<!--
STYLE: Bauhaus
LOOK: A 1920s Bauhaus poster come to life: red, yellow, blue and black circles, squares, quarter-circles,
  triangles and bars on off-white paper, locked to a strict 4x4 grid, with a heavy geometric lowercase headline.
BEST FOR: design studios, galleries, architecture, education, editorial
AVOID WHEN: brands with soft or organic personalities
PAIRS WITH: a geometric sans (Futura-like), red / yellow / blue and black on off-white
TECHNIQUE: Every shape in a cell is ONE primitive: a four-corner quad with a radius per corner (square = no radii,
  circle = .5 everywhere, quarter-circle = 1 on one corner, leaf = 1 on two opposite corners, triangle = one corner
  pulled to the centre). Interpolating corners, radii, quarter-turns and colours morphs any shape into any other
  on canvas. Compositions are written as 4-character tokens per cell; a diagonal stagger and a hard ease-in-out
  make the recomposition feel mechanical. Between recompositions "free" cells (lowercase tokens) tick round 90 degrees.
KNOBS: CSS --paper --ink --red --yellow --blue (palette, read by JS); SCENES (the compositions: shape letter
  S C Q L H T B D _, quarter-turns 0-3, fg colour, bg colour; lowercase shape = free to tick); MOVE (seconds a cell
  takes to change), STAGGER (diagonal delay per cell), HOLD (seconds a composition rests), TICK_EVERY (pace of the
  idle ticks); ease() (the mechanical curve).
COST: Very low: 16 cells of canvas paths per frame, no shadows or blur. The grain is a static overlay generated once.
  Fine on any phone.
REDUCED MOTION: The first composition, fully composed and still.
PITFALLS: Off-palette in-betweens (colour lerps pass through mud): most cells keep their colour between scenes and
  moves are short. Hairline seams between neighbouring cells: cell size is an even whole number of device pixels and
  the grid origin is pixel-snapped. Bouncy or elastic easing reads as cartoon, not Bauhaus: quartic in-out only.
  Random compositions look like clip art: the scenes are composed by hand.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bauhaus</title>
<style>
  :root {
    --paper: #eee6d6; --ink: #171615; --red: #d4382a; --yellow: #f0b31c; --blue: #1e4a96;
    --gap: clamp(18px, 4.5vmin, 64px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100svh; overflow: hidden; padding: var(--gap); gap: var(--gap);
    background: var(--paper); color: var(--ink);
    font-family: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", ui-sans-serif, system-ui, sans-serif;
    display: grid; align-content: center;
    grid-template: "art" minmax(0, calc(100vw - 2 * var(--gap))) "copy" auto / minmax(0, 1fr);
  }
  @media (min-aspect-ratio: 1/1) {
    body { grid-template: "copy art" minmax(0, 1fr) / minmax(0, 1fr) minmax(0, 1.15fr); align-content: stretch; }
    .copy { align-self: center; }
  }
  body::after {   /* printed-paper grain over everything, generated once in JS */
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: var(--grain); mix-blend-mode: multiply; opacity: .5;
  }
  .art { grid-area: art; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { grid-area: copy; align-self: end; max-width: 34rem; }
  .meta {
    display: flex; justify-content: space-between; gap: 1rem; padding-top: .7em; margin-bottom: 1.4em;
    border-top: 4px solid var(--ink); font-size: clamp(12px, 1.5vmin, 15px); letter-spacing: .14em;
    text-transform: lowercase; font-variant-numeric: tabular-nums;
  }
  h1 {
    margin: 0; font-weight: 700; line-height: .86; letter-spacing: -.035em; text-transform: lowercase;
    font-size: min(17vw, 10.5vh, 8.4rem);
  }
  @media (min-aspect-ratio: 1/1) { h1 { font-size: min(8vw, 15vh, 8.4rem); } }
  h1 i { font-style: normal; color: var(--red); }
  p { margin: 1.1em 0 0; max-width: 26em; font-size: clamp(15px, 1.9vmin, 19px); line-height: 1.45; }
</style>
</head>
<body>
  <div class="art"><canvas id="c" aria-hidden="true"></canvas></div>
  <div class="copy">
    <div class="meta"><span>nº 16 — form study</span><span id="count">01 / 04</span></div>
    <h1>form<br>follows<br>function<i>.</i></h1>
    <p>Circle, square, triangle. Three primaries and black, locked to a grid and nothing more.</p>
  </div>
<script>
(() => {
  const css = getComputedStyle(document.documentElement);
  const hex = (n) => css.getPropertyValue('--' + n).trim();
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const PAL = { p: rgb(hex('paper')), k: rgb(hex('ink')), r: rgb(hex('red')), y: rgb(hex('yellow')), b: rgb(hex('blue')) };

  // One primitive for every shape: 4 corners (x,y in a unit cell, clockwise from top-left) + 4 corner radii.
  const SQ = [0, 0, 1, 0, 1, 1, 0, 1];
  const SHAPES = {
    S: [SQ, [0, 0, 0, 0]],                                 // square
    C: [SQ, [.5, .5, .5, .5]],                             // circle
    Q: [SQ, [1, 0, 0, 0]],                                 // quarter-circle, centred on the bottom-right corner
    L: [SQ, [1, 0, 1, 0]],                                 // leaf
    H: [[0, .5, 1, .5, 1, 1, 0, 1], [.5, .5, 0, 0]],       // half-circle standing on the bottom edge
    T: [[0, 0, 1, 0, .5, .5, 0, 1], [0, 0, 0, 0]],         // right triangle (bottom-right corner pulled to centre)
    B: [[0, .36, 1, .36, 1, .64, 0, .64], [0, 0, 0, 0]],   // bar: joins its neighbours into one long bar
    D: [[.31, .31, .69, .31, .69, .69, .31, .69], [.19, .19, .19, .19]], // dot
    _: [[.5, .5, .5, .5, .5, .5, .5, .5], [0, 0, 0, 0]],   // empty
  };
  // Token = shape, quarter-turns clockwise, fg colour, bg colour. Lowercase shape = free to tick while resting.
  const SCENES = [
    'S0yp B0kp B0kp q1bp   _0pp Q0rp Q1rp _0pp   t0kp Q3rp Q2rp _0pp   S0bp H0yb _0pp d0rp',
    'C0yp _0pp _0pp T2bp   B1kp _0pp T2bp S0bp   B1kp T2bp S0bp S0bp   T2bp S0bp S0bp q0rb',
    'h2rp _0pp _0pp l0bp   S0kp Q0yk Q1yk S0kp   S0kp Q3yk Q2yk S0kp   B0kp B0kp t3rp D0kp',
    'Q2bp Q3bp S0rp q1pr   Q1bp Q0bp _0pp _0pp   _0pp H2kp H2kp C0yp   l1rp S0yp S0yp B0kp',
  ].map((s) => {
    const cells = s.trim().split(/\s+/).map((t) => ({
      sh: SHAPES[t[0].toUpperCase()], rot: +t[1], fg: PAL[t[2]], bg: PAL[t[3]], free: t[0] !== t[0].toUpperCase(),
    }));
    return { cells, free: cells.map((c, i) => (c.free ? i : -1)).filter((i) => i >= 0) };
  });
  const EMPTY = { cells: SCENES[0].cells.map(() => ({ sh: SHAPES._, rot: 0, fg: PAL.p, bg: PAL.p })), free: [] };

  const MOVE = .72, STAGGER = .07, HOLD = 3.2, TICK = .5, TICK_EVERY = .9;
  const TRANS = MOVE + STAGGER * 6, PERIOD = TRANS + HOLD;
  const ease = (t) => (t < .5 ? 8 * t ** 4 : 1 - 8 * (1 - t) ** 4);   // quartic in-out: hard start, hard stop
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const mix = (a, b, u) => a + (b - a) * u;

  // Quarter-turns a free cell has ticked through, h seconds into its scene's rest.
  function ticks(scene, i, h) {
    let e = 0;
    for (let n = 0; scene.free.length; n++) {
      const s = .4 + n * TICK_EVERY;
      if (s + TICK > HOLD) break;
      if (scene.free[n % scene.free.length] === i) e += ease(clamp((h - s) / TICK));
    }
    return e;
  }

  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), count = document.getElementById('count');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cell = 0, ox = 0, oy = 0, shown = -1;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2), r = cv.parentNode.getBoundingClientRect();
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    cell = Math.max(2, Math.floor(Math.min(cv.width, cv.height) / 8) * 2);   // even whole device pixels: no seams
    ox = Math.floor((cv.width - cell * 4) / 2);
    oy = innerWidth >= innerHeight ? Math.floor((cv.height - cell * 4) / 2) : 0;
  }

  function shapePath(p, r) {   // rounded quad through arcTo; radius 0 gives a sharp corner
    ctx.beginPath();
    ctx.moveTo((p[6] + p[0]) / 2, (p[7] + p[1]) / 2);
    for (let i = 0; i < 4; i++) {
      const a = i * 2, b = ((i + 1) % 4) * 2;
      ctx.arcTo(p[a], p[a + 1], p[b], p[b + 1], Math.max(0, r[i]));
    }
    ctx.closePath();
  }
  const col = (a, b, u) => `rgb(${a.map((v, i) => Math.round(mix(v, b[i], u))).join(',')})`;

  function draw(t) {
    const k = Math.floor(t / PERIOD), ph = t - k * PERIOD;
    const to = SCENES[k % SCENES.length], from = k ? SCENES[(k - 1) % SCENES.length] : EMPTY;
    if (k !== shown) { shown = k; count.textContent = `0${k % SCENES.length + 1} / 0${SCENES.length}`; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    to.cells.forEach((b, i) => {
      const x = i % 4, y = (i / 4) | 0, a = from.cells[i];
      const u = ease(clamp((ph - (x + y) * STAGGER) / MOVE));
      let rot;
      if (ph < TRANS) {   // recomposing: always turn clockwise, like a dial
        const rf = a.rot + ticks(from, i, HOLD);
        rot = rf + (((b.rot - rf) % 4) + 4) % 4 * u;
      } else rot = b.rot + ticks(to, i, ph - TRANS);
      ctx.setTransform(cell, 0, 0, cell, ox + x * cell, oy + y * cell);
      ctx.fillStyle = col(a.bg, b.bg, u);
      ctx.fillRect(0, 0, 1, 1);
      ctx.translate(.5, .5); ctx.rotate(rot * Math.PI / 2); ctx.translate(-.5, -.5);
      shapePath(a.sh[0].map((v, j) => mix(v, b.sh[0][j], u)), a.sh[1].map((v, j) => mix(v, b.sh[1][j], u)));
      const E = SHAPES._, fa = a.sh === E ? b.fg : a.fg, fb = b.sh === E ? a.fg : b.fg;   // empty cells take no colour: no grey in-betweens
      ctx.fillStyle = col(fa, fb, u);
      ctx.fill();
    });
  }

  // Grain: a small noise tile, made once.
  const g = document.createElement('canvas'); g.width = g.height = 160;
  const gx = g.getContext('2d'), img = gx.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 90 + Math.random() * 165;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 34;
  }
  gx.putImageData(img, 0, 0);
  document.documentElement.style.setProperty('--grain', `url(${g.toDataURL()})`);

  resize();
  addEventListener('resize', () => { resize(); if (reduce) draw(TRANS); });
  if (reduce) { draw(TRANS); return; }
  let t0 = null;
  requestAnimationFrame(function loop(now) {
    if (t0 === null) t0 = now;
    draw((now - t0) / 1000);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>

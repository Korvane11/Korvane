<!doctype html>
<!-- Pour My Coffee Co: the opening scene, rendered offline frame by frame (render_pour.cjs).
     Six in the morning in Rita Ranch: low sun comes in through the storefront glass and the desert tree out
     front, and lies across a pale oak table in soft dappled light. On the table, a white porcelain cup and saucer
     with an espresso. Milk pours in from above, the crema lightens, a white blob comes up and grows, the pour
     pulls through it and leaves a heart; then steam rises into the sun.
     window.renderFrame(t, layout, passes, mode, w, h) -> PNG data URL.
     mode 0 = the intro (t from 0 to T_END), mode 1 = the steam loop (t in [0, LOOP)): the intro's last frame is the
     loop's first. Units are centimetres; the table is y = 0, the cup stands at the origin. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT;
uniform int uMode;
uniform vec2 uJit;
uniform float uSeed;
uniform vec3 uCam;
uniform vec3 uTgt;
uniform float uFov;
uniform vec2 uShift;
out vec4 outC;           // linear rgb, alpha = depth along the ray (cm)

const float PI = 3.14159265;
// ------------------------------------------------------------------ timing (seconds)
const float T_START = 0.95;   // the milk's head reaches the coffee
const float T_EMERGE = 1.55;  // the white comes up
const float T_PULL = 2.70;    // the pitcher lifts and pulls through
const float T_STOP = 3.15;    // the stream breaks
const float T_END = 5.0;      // = 120 / 24: the intro's last frame == the loop's first
const float LOOP = 6.0;
const float G = 981.0;

// ------------------------------------------------------------------ geometry
const float CY = 0.42;                     // the saucer's well: where the cup stands
const float H = 5.6, RB = 2.25, RR = 4.45, WALL = 0.26, YIN = 0.50, LMAX = 5.18;
const float S_R = 7.3;                     // saucer radius

float smax(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (a - b) / k, 0.0, 1.0); return mix(b, a, h) + k * h * (1.0 - h); }
float smin(float a, float b, float k) { return -smax(-a, -b, k); }

float rOut(float y) { float h = clamp(y / H, 0.0, 1.0); return RB + (RR - RB) * (1.0 - pow(1.0 - h, 2.3)); }
float rIn(float y) { return rOut(y) - WALL; }
float sdSide(vec3 p) {
  float rho = length(p.xz), y = p.y, e = 0.01;
  float dr = (rOut(y + e) - rOut(y - e)) / (2.0 * e);
  return smax((rho - rOut(y)) / sqrt(1.0 + dr * dr), -y, 0.12);
}
float sdCav(vec3 p) { return smax(sdSide(p) + WALL, YIN - p.y, 0.55); }
// the handle: an ear-shaped loop on the right, a flat strap
const vec3 HND_C = vec3(5.05, 3.55, 0.0);
const vec2 HND_AB = vec2(0.95, 1.30);
const float HND_TILT = 0.22;
const vec2 HND_T = vec2(0.30, 0.20);
float sdHandle(vec3 p) {
  vec3 q = p - HND_C;
  float c = cos(HND_TILT), s = sin(HND_TILT);
  q.xy = vec2(c * q.x - s * q.y, s * q.x + c * q.y);
  float e = length(q.xy / HND_AB);
  float g = max(length(q.xy / (HND_AB * HND_AB)) / max(e, 1e-4), 1.0 / HND_AB.y);
  float dp = e < 1.0 ? (e - 1.0) * HND_AB.x : (e - 1.0) / g;
  return (length(vec2(dp, q.z) / HND_T) - 1.0) * HND_T.y;
}
float sdCup(vec3 p) {       // cup-local (its base at y = 0)
  float body = smax(sdSide(p), p.y - H, 0.06);
  body = smin(body, sdHandle(p), 0.18);
  return smax(body, -sdCav(p), 0.11);
}
// the saucer: a thin dish, flat in the well, rising to a rolled rim; a foot ring under it
float ysauc(float r) { return 0.42 + 0.50 * smoothstep(3.0, 7.0, r) + 0.06 * smoothstep(6.4, 7.2, r); }
float sdSaucer(vec3 p) {
  float r = length(p.xz), e = 0.02;
  float dy = (ysauc(r + e) - ysauc(r - e)) / (2.0 * e);
  float plate = (abs(p.y - ysauc(r) + 0.13) - 0.13) / sqrt(1.0 + dy * dy);
  plate = smax(plate, r - S_R, 0.12);
  float foot = max(max(abs(r - 3.25) - 0.22, p.y - 0.32), -p.y);
  return smin(plate, foot, 0.08);
}

// ------------------------------------------------------------------ noise
float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float fbm3(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float hashW(vec3 i, float per) { i.y = mod(i.y, per); return hash3(i); }
float vnoiseW(vec3 x, float per) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hashW(i, per), hashW(i + vec3(1, 0, 0), per), f.x), mix(hashW(i + vec3(0, 1, 0), per), hashW(i + vec3(1, 1, 0), per), f.x), f.y),
             mix(mix(hashW(i + vec3(0, 0, 1), per), hashW(i + vec3(1, 0, 1), per), f.x), mix(hashW(i + vec3(0, 1, 1), per), hashW(i + vec3(1, 1, 1), per), f.x), f.y), f.z);
}
float fbmW(vec3 p, float per) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoiseW(p, per); p = vec3(p.x * 2.0 + 13.7, p.y * 2.0, p.z * 2.0 + 5.3); per *= 2.0; a *= 0.5; } return s; }

// ------------------------------------------------------------------ the pour over time
float shotT() { return uMode == 0 ? min(uT, T_END) : T_END; }
float tau() { return uMode == 0 ? uT - T_END : uT; }          // loop time: the intro ends where the loop starts
float level(float t) {      // cup-local height of the surface
  float k = clamp((t - T_START) / (T_STOP - T_START + 0.2), 0.0, 1.0);
  return 2.05 + (LMAX - 2.05) * (1.0 - pow(1.0 - k, 1.7));
}
float pourOn(float t) { return smoothstep(T_START - 0.05, T_START + 0.08, t) * (1.0 - smoothstep(T_STOP - 0.04, T_STOP + 0.10, t)); }
// the white blob: its centre (x, z) and radius
vec2 blobC(float t) { return vec2(0.05, -0.75 + 0.30 * smoothstep(T_EMERGE, T_PULL, t)); }
float blobRad(float t) { float k = clamp((t - T_EMERGE) / (T_PULL - T_EMERGE + 0.15), 0.0, 1.0); return 2.45 * (1.0 - pow(1.0 - k, 1.8)); }
// the pull: how far the stream has travelled forward through the blob
float pullK(float t) { return smoothstep(T_PULL, T_STOP, t); }
float pullZ(float t) { vec2 c = blobC(t); return mix(c.y, c.y + blobRad(t) + 0.55, pullK(t)); }
// where the stream meets the surface
vec2 hitXZ(float t) {
  vec2 c = blobC(t);
  float z = t < T_PULL ? c.y + 0.05 * sin(t * 9.0) : pullZ(t);
  return vec2(c.x + 0.04 * sin(t * 7.0 + 1.0), z);
}

// ------------------------------------------------------------------ the stream
float sdStream(vec3 p, float t, float L) {
  float head = 40.0 - 0.5 * G * pow(max(t - (T_START - 0.24), 0.0), 2.0);
  float bottom = max(head, L - 0.15);
  float top = t < T_STOP ? 80.0 : 40.0 - 0.5 * G * pow(t - T_STOP, 2.0) - 40.0 * (t - T_STOP);
  if (t < T_START - 0.24 || top <= bottom) return 1e3;
  float y = p.y;
  float thin = mix(1.0, 0.62, smoothstep(T_PULL - 0.1, T_PULL + 0.15, t));   // the pitcher lifts: a thinner stream
  float r = (0.30 + 0.025 * sin(y * 1.7 + t * 9.0)) * thin;
  r *= mix(1.0, 1.35, smoothstep(L + 0.8, L, y));
  vec2 h = hitXZ(t);
  // the stream leans back toward where the pitcher was, a moment ago, higher up
  vec2 lag = (h - hitXZ(t - 0.06)) * clamp((y - L) / 6.0, 0.0, 3.0);
  vec2 c = h - lag + vec2(0.04 * sin(y * 0.8 + t * 6.0), 0.03 * cos(y * 0.6 + t * 4.0));
  float lo = bottom + r, hi = max(top - r, lo);
  return length(vec3(p.x - c.x, y - clamp(y, lo, hi), p.z - c.y)) - r;
}

// ------------------------------------------------------------------ scene
// materials: 1 porcelain (cup), 2 porcelain (saucer), 3 the drink's surface, 4 milk stream
bool gNoStream = false;
vec2 map(vec3 p, float t, float L) {
  vec2 r = vec2(1e3, 0.0);
  vec3 q = p - vec3(0.0, CY, 0.0);
  float bc = max(length(p.xz - vec2(0.6, 0.0)) - 6.6, max(-q.y - 0.1, q.y - H - 0.2));
  if (bc < 0.5) {
    r = vec2(sdCup(q) * 0.85, 1.0);
    float l = max(sdCav(q) + 0.01, q.y - L);
    if (l < r.x) r = vec2(l, 3.0);
  } else r = vec2(bc, 1.0);
  float bs = max(length(p.xz) - S_R - 0.3, max(-p.y - 0.1, p.y - 1.3));
  float s = bs < 0.3 ? sdSaucer(p) * 0.6 : bs;
  if (s < r.x) r = vec2(s, 2.0);
  if (!gNoStream && t > T_START - 0.3 && t < T_STOP + 0.4) {
    vec2 h = hitXZ(t);
    float bst = length(p.xz - h) - 1.4;
    float st = bst < 0.4 ? sdStream(p, t, L + CY) * 0.8 : bst;
    if (st < r.x) r = vec2(st, 4.0);
  }
  return r;
}
vec3 normalAt(vec3 p, float t, float L) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy, t, L).x - map(p - e.xyy, t, L).x,
                        map(p + e.yxy, t, L).x - map(p - e.yxy, t, L).x,
                        map(p + e.yyx, t, L).x - map(p - e.yyx, t, L).x));
}
vec2 march(vec3 ro, vec3 rd, float t, float L, float tmax) {
  vec3 bmin = vec3(-8.0, -0.1, -8.0), bmax = vec3(8.0, 90.0, 8.0);
  vec3 inv = 1.0 / rd, t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), max(tn.z, 0.0)), b = min(min(tf.x, tf.y), min(tf.z, tmax));
  if (a >= b) return vec2(-1.0, 0.0);
  float d = a;
  for (int i = 0; i < 220; i++) {
    vec3 p = ro + rd * d;
    vec2 h = map(p, t, L);
    if (h.x < 0.0007 * d) return vec2(d, h.y);
    d += h.x;
    if (d > b) break;
  }
  return vec2(-1.0, 0.0);
}
float softShadow(vec3 ro, vec3 rd, float t, float L, float k, float jit) {
  vec3 bmin = vec3(-8.0, -0.1, -8.0), bmax = vec3(8.0, 7.0, 8.0);
  vec3 inv = 1.0 / rd, t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), max(tn.z, 0.0)), b = min(min(tf.x, tf.y), tf.z);
  if (a >= b) return 1.0;
  gNoStream = true;
  float res = 1.0, d = max(a, 0.02) + 0.03 * jit, ph = 1e10;
  for (int i = 0; i < 140; i++) {
    float h = map(ro + rd * d, t, L).x;
    res = min(res, k * max(h, 0.0) / d);
    ph = h;
    d += clamp(h, 0.012, 0.30) * (0.75 + 0.5 * fract(jit + float(i) * 0.618));
    if (res < 0.002 || d > b) break;
  }
  gNoStream = false;
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n, float t, float L) {
  float o = 0.0, s = 1.0;
  gNoStream = true;
  for (int i = 1; i <= 5; i++) { float h = 0.06 * float(i) * float(i); o += (h - map(p + n * h, t, L).x / 0.85) * s; s *= 0.6; }
  gNoStream = false;
  return clamp(1.0 - 1.4 * o, 0.0, 1.0);
}

// ------------------------------------------------------------------ light: the low morning sun through the glass and the tree
const vec3 SUN = normalize(vec3(-0.50, 0.36, -0.79));    // toward the sun: low, behind the cup and to the left
vec3 sunCol() { float k = uMode == 0 ? smoothstep(0.0, 1.1, uT) : 1.0; return mix(vec3(1.0, 0.55, 0.30), vec3(1.0, 0.80, 0.60), k) * 5.2; }
const vec3 SKY = vec3(0.50, 0.66, 0.74) * 0.55;          // the open sky through the glass: an aqua fill in the shadows
// the storefront: the tree out front and the glass's mullion, as a soft pattern on a plane facing the sun
vec3 SU() { return normalize(cross(SUN, vec3(0, 1, 0))); }
vec3 SV() { return cross(SU(), SUN); }
float sway() { return 0.55 * sin(2.0 * PI * tau() / LOOP) + 0.25 * sin(4.0 * PI * tau() / LOOP + 1.1); }
// sun flecks: round soft spots of sun where the leaves leave gaps (the sun's disc images them; on the table they
// stretch into ellipses along the light by themselves, the pattern lives on a plane facing the sun)
float flecks(vec2 q) {
  vec2 g = q / 1.7, i = floor(g), f = fract(g);
  float lit = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 o = vec2(x, y), c = i + o;
    float h = hash3(vec3(c, 3.1));
    if (h > 0.30 + 0.55 * smoothstep(0.35, 0.65, fbm3(vec3(c * 0.35, 2.0)))) continue;   // gaps come in clusters
    vec2 pt = (o + vec2(hash3(vec3(c, 7.7)), hash3(vec3(c, 1.3))) - f) * vec2(1.0, 0.8 + 0.5 * hash3(vec3(c, 4.4)));
    float rad = 0.08 + 0.30 * pow(hash3(vec3(c, 5.9)), 1.6);
    lit = max(lit, smoothstep(rad + 0.26, rad - 0.10, length(pt)) * (0.45 + 0.55 * hash3(vec3(c, 9.2))));
  }
  return lit;
}
float treeLight(vec3 p) {
  vec2 q = vec2(dot(p, SU()), dot(p, SV()));
  float sw = sway();
  vec2 lq = q + vec2(sw * 0.7, sw * 0.15);
  // the canopy: big soft masses of small leaves, thicker to the left and far side of the table
  float mass = fbm3(vec3(lq * 0.034, 1.7)) + 0.30 * fbm3(vec3(lq * 0.13, 4.2));
  float region = smoothstep(2.0, -14.0, q.x - 0.35 * q.y + 3.0 * sin(q.y * 0.05));
  float canopy = smoothstep(0.40, 0.62, mass) * region;
  // inside it, the gaps let the sun through in flecks
  float gaps = flecks(lq + vec2(13.0, 7.0)) * 0.85 + 0.15 * smoothstep(0.4, 0.7, fbm3(vec3(lq * 0.35, 8.0)));
  float shade = canopy * (1.0 - gaps) * 0.82;
  // two branches, curved, soft (the tree is a few feet beyond the glass)
  float br = 0.0;
  for (int i = 0; i < 2; i++) {
    float fi = float(i);
    float x = -30.0 + 11.0 * fi + q.y * (0.55 - 0.3 * fi) + 5.0 * sin(q.y * 0.04 + fi * 2.0) + 1.5 * fbm3(vec3(q.y * 0.08, fi, 2.0));
    br = max(br, smoothstep(1.6, 0.4, abs(lq.x - x)) * smoothstep(-35.0, 0.0, q.y) * 0.7);
  }
  shade = max(shade, br);
  // the glass's mullion: one soft band, off to the right, behind the cup
  float mul = smoothstep(2.6, 0.6, abs(q.x - 19.0 - 0.06 * q.y)) * 0.62;
  return (1.0 - shade) * (1.0 - mul);
}

// ------------------------------------------------------------------ the table: pale white oak, planks along x
vec3 oak(vec2 xz) {
  float pw = 14.0;
  float u = (xz.y + 3.0) / pw, k = floor(u), f = fract(u);
  float hk = hash1(k + 11.0);
  float x = xz.x + hk * 300.0;
  float grain = fbm3(vec3(x * 0.030, (xz.y + k * 9.0) * 0.55, k * 1.3));
  float ring = 0.5 + 0.5 * sin((xz.y + 4.0 * fbm3(vec3(x * 0.012, xz.y * 0.07, k))) * 2.6 + k);
  float fine = vnoise(vec3(x * 0.22, xz.y * 3.0, 2.0));
  vec3 a = mix(vec3(0.66, 0.53, 0.40), vec3(0.74, 0.61, 0.47), hk);
  vec3 c = a * (0.86 + 0.20 * grain) * (0.95 + 0.06 * ring) * (0.97 + 0.05 * fine);
  float seam = smoothstep(0.0, 0.010, f) * smoothstep(1.0, 0.990, f);
  return c * mix(0.55, 1.0, seam);
}

float ggx(vec3 n, vec3 v, vec3 l, float rough) {
  vec3 h = normalize(v + l); float a = rough * rough, a2 = a * a;
  float nh = max(dot(n, h), 0.0), nl = max(dot(n, l), 0.0), nv = max(dot(n, v), 0.001);
  float dd = nh * nh * (a2 - 1.0) + 1.0; float D = a2 / (PI * dd * dd);
  float k = (rough + 1.0) * (rough + 1.0) / 8.0; float Gs = (nl / (nl * (1.0 - k) + k)) * (nv / (nv * (1.0 - k) + k));
  return D * Gs / (4.0 * nv + 0.001);
}
// what a glossy surface reflects: the bright glass behind, the sunlit table, the room's pale ceiling
vec3 env(vec3 d) {
  vec3 c = mix(vec3(0.62, 0.55, 0.48) * 0.9, vec3(0.70, 0.74, 0.76), smoothstep(-0.2, 0.5, d.y));
  float glass = smoothstep(0.1, 0.6, -d.z) * smoothstep(-0.05, 0.12, d.y) * smoothstep(0.75, 0.35, d.y);
  c += vec3(1.0, 0.92, 0.82) * 2.4 * glass * (0.85 + 0.15 * vnoise(vec3(d.xy * 6.0, 1.0)));
  c += sunCol() * 0.6 * pow(max(dot(d, SUN), 0.0), 400.0);
  return c;
}
vec3 tableColor(vec3 p, vec3 rd, float jit, float t, float L, bool full) {
  vec3 alb = oak(p.xz);
  float r = length(p.xz);
  float sh = 1.0;
  if (r < 30.0) sh = softShadow(p + vec3(0, 0.01, 0), SUN, t, L, 5.0, jit);
  float tl = treeLight(p);
  float aoc = mix(0.50, 1.0, smoothstep(S_R - 0.3, S_R + 2.2, r));          // the contact shade under the saucer's rim
  vec3 c = alb * (sunCol() * SUN.y * sh * tl + SKY * aoc * 0.95 + vec3(0.30, 0.24, 0.18) * 0.12);
  if (full) {   // a satin oil finish: a soft sheen of the bright glass
    vec3 n = normalize(vec3((vnoise(vec3(p.xz * 0.6, 3.0)) - 0.5) * 0.04, 1.0, 0.0));
    vec3 rr = reflect(rd, n);
    float F = 0.03 + 0.5 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    c += env(rr) * F * 0.35 * aoc;
    c += sunCol() * sh * tl * ggx(n, -rd, SUN, 0.45) * SUN.y * 0.06;
  }
  return c;
}

// ------------------------------------------------------------------ the drink's surface: crema, milk, the heart
vec3 surfaceColor(vec3 p, float t, float L, out float white) {
  vec2 xz = p.xz;
  vec2 h = hitXZ(t);
  float rIn0 = rIn(L);
  float rr = length(xz);
  // espresso crema, then lightened as milk sinks under it
  float n = fbm(vec3(xz * 1.6, 3.1)), tig = fbm(vec3(xz * 5.0, 9.7));
  vec3 crema = mix(vec3(0.36, 0.17, 0.06), vec3(0.55, 0.30, 0.12), smoothstep(0.30, 0.75, n));
  crema = mix(crema, vec3(0.20, 0.08, 0.025), smoothstep(0.58, 0.78, tig) * 0.45);
  float mixK = smoothstep(T_START, T_EMERGE + 0.4, t);
  vec3 latte = mix(vec3(0.58, 0.36, 0.18), vec3(0.70, 0.48, 0.28), smoothstep(0.35, 0.7, n));
  latte *= 1.0 - 0.18 * smoothstep(rIn0 - 1.6, rIn0, rr);                     // a deeper brown ring at the wall
  float spread = smoothstep(0.0, 1.0, mixK) * 6.0 + 0.6;
  vec3 base = mix(crema, latte, smoothstep(spread, spread * 0.5, length(xz - blobC(t))) * mixK);
  base = mix(base, latte, smoothstep(T_EMERGE, T_PULL, t));
  base *= 0.96 + 0.08 * vnoise(p * 30.0);
  // the heart: the blob, with the pull-through carrying it forward along its middle
  vec2 c = blobC(t);
  float R = blobRad(t);
  float k = pullK(t);
  float zp = pullZ(t);
  float x = xz.x - c.x;
  float prof = 0.80 * exp(-x * x / 0.07) + 0.35 * exp(-x * x / 0.55);
  float gate = smoothstep(zp + 0.25, zp - 0.25, xz.y);
  vec2 src = xz - vec2(0.0, 1.25 * k * prof * gate * (0.55 + 0.45 * R / 2.2));
  src += 0.05 * vec2(vnoise(vec3(xz * 2.0, 1.0)) - 0.5, vnoise(vec3(xz * 2.0, 4.0)) - 0.5);
  float d = length((src - c) * vec2(1.0, 1.06));
  float w = R > 0.02 ? smoothstep(R + 0.05, R - 0.05, d) : 0.0;

  float rr = r + 0.30 * (vnoise(vec3(d * 1.5, t * 1.2)) - 0.5);

// ------------------------------------------------------------------ steam, lit from behind by the sun (loops every LOOP s)
vec4 steam(vec3 ro, vec3 rd, float tHit, float jit) {
  float k = uMode == 0 ? smoothstep(T_STOP - 0.4, T_END, uT) : 1.0;

  float cosT = dot(rd, SUN);
  float hg = (1.0 - 0.36) / pow(1.0 + 0.36 - 1.2 * cosT, 1.5) / (4.0 * PI);   // Henyey-Greenstein, g = 0.6: glows toward the sun

    float s = n0 + (float(i) + jit) * dt;
    vec3 p = ro + rd * s;
    float hy = p.y - y0;
    // it rises, drifts back and to the left with the room's air, and widens
    vec2 c = vec2(-0.25, -0.35) * hy * 0.10;

// ------------------------------------------------------------------ shading

}
vec3 shadeHit(vec3 p, vec3 rd, float mat, float t, float L, float jit) {
  if (mat > 3.5) {          // the milk stream: white, soft, glowing where the sun comes through it

    float back = pow(max(dot(rd, SUN), 0.0), 3.0) * 0.6;
    vec3 c = alb * (sunCol() * (max(nl * 0.7 + 0.3, 0.0) + back) * 0.85 + SKY * 0.9);
    float nv = max(dot(n, -rd), 0.0);
    c += env(reflect(rd, n)) * (0.03 + 0.5 * pow(1.0 - nv, 5.0)) * 0.6;
    c += sunCol() * ggx(n, -rd, SUN, 0.18) * max(nl, 0.0) * 0.6;
    return c;
  }
  if (mat > 2.5) {          // the drink
    vec3 q = p - vec3(0.0, CY, 0.0);
    vec3 n = surfNormal(p, t);
    float white;
    vec3 alb = surfaceColor(p, t, L, white);
    float sh = softShadow(p + vec3(0, 0.02, 0), SUN, t, L, 10.0, jit);
    float rr = length(p.xz), ri = rIn(L);
    float wallShade = mix(0.55, 1.0, smoothstep(ri - 0.05, ri - 1.2, rr));   // the wall's shade on the surface
    vec3 c = alb * (sunCol() * max(dot(n, SUN), 0.0) * sh * 0.95 + SKY * 0.85 * wallShade);
    float nv = max(dot(n, -rd), 0.0);
    float F = 0.02 + 0.98 * pow(1.0 - nv, 5.0);
    c += env(reflect(rd, n)) * F * mix(0.55, 0.35, white) * wallShade;
    c += sunCol() * sh * ggx(n, -rd, SUN, mix(0.07, 0.16, white)) * max(dot(n, SUN), 0.0) * mix(0.9, 0.5, white);
    return c;

void main() {
  vec2 px = gl_FragCoord.xy + uJit;
  vec2 uv = (px - 0.5 * uRes) / uRes.y;

  float jit = fract(uSeed + fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715)))));
  float t = shotT();
  if (uMode == 0) t = uT;
  float tc = min(uT, T_END);
  float tt = uMode == 0 ? uT : T_END;
  float L = level(tt);

  float tTab = rd.y < 0.0 ? -ro.y / rd.y : 1e5;
  vec2 h = march(ro, rd, tt, L, tTab);
  vec3 col; float depth;
  if (h.x > 0.0) { vec3 p = ro + rd * h.x; col = shadeHit(p, rd, h.y, tt, L, jit); depth = h.x; }
  else if (tTab < 1e4) { vec3 p = ro + rd * tTab; col = tableColor(p, rd, jit, tt, L, true); depth = tTab;
    col *= 1.0 - 0.10 * smoothstep(60.0, 160.0, length(p.xz)); }

  vec4 s = steam(ro, rd, depth, jit);
  col = col * (1.0 - s.a) + s.rgb;
  outC = vec4(col, depth);

<!doctype html>
<!-- The link-preview image (1200 x 630): the settled frame of the opening, their logo over it. render/make_og.cjs screenshots it. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: 'DM Sans'; src: url(../assets/fonts/dmsans.woff2) format('woff2'); font-weight: 100 1000; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0d0b09; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }

  .logo { position: absolute; left: 72px; top: 132px; width: 430px; }
  .line { position: absolute; left: 76px; top: 470px; font: 500 26px/1.3 'DM Sans', sans-serif; color: #f4efe6; letter-spacing: 0.01em; }
  .line span { display: block; font-weight: 400; font-size: 22px; opacity: 0.82; margin-top: 4px; }
</style>
<img class="bg" src="../assets/film/still-l.jpg" alt="">
<div class="shade"></div>
<img class="logo" src="../assets/brand/logo-full-cream.svg" alt="">

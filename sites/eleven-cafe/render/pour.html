<!doctype html>
<!-- Eleven Cafē: the opening scene, rendered offline frame by frame (see render_pour.cjs).
     Low amber sun through a tall window lies across a varnished walnut counter in stripes;
     the air is hazy with it. On the counter, a wide speckled stoneware cup (cream glaze with
     brown flecks, a raw brown rim, a round loop handle, the one the owner chose): espresso
     pours in from above, crema rises, the pour stops, steam rises into the light. Soft focus
     everywhere but the cup.
     window.renderFrame(t, layout, passes, mode, w, h, basePasses) -> PNG data URL.
     mode 0 = the intro shot (t from 0), mode 1 = the steam loop (t in [0, LOOP)),
     mode 2 (internal) = the still scene the loop's steam is laid over. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT;        // shot time, seconds
uniform int uMode;       // 0 intro, 1 loop, 2 the still scene for the loop
uniform int uLayout;     // 0 landscape, 1 portrait
uniform vec2 uJit;
uniform float uSeed;     // per pass: jitters the haze, the soft reflections and the soft shadows
uniform sampler2D uBase; // the steam pass: the scene drawn already (alpha = its depth along the ray)
uniform vec3 uCam;       // the camera (cm, relative to the cup), its vertical field of view (degrees) and the lens shift
uniform float uFov;      // that places the cup on screen: all set from CAM in the page script
uniform vec2 uShift;
uniform int uSteamPass;  // 1: the steam alone, over the scene already drawn (its depth in uBase's alpha); see renderFrame
out vec4 outC;           // linear rgb, alpha = depth along the ray (cm)

// ------------------------------------------------------------------ timing
const float T_START = 0.55;   // the stream leaves the spout (off frame)
const float T_STOP  = 3.05;   // the stream breaks
const float T_END   = 4.2916667;   // = 103 / 24: the intro's last frame == the loop's first frame
const float LOOP    = 6.0;    // the steam loop's length
const float G = 981.0;        // cm/s^2

// ------------------------------------------------------------------ cup geometry (cm)
// the owner's photo of a stoneware cup: a wide round bowl, widest at the rim (about 10 cm), half as tall,
// on a small flat base (0.44 of the rim); a loop handle on its right
const float H = 4.95, RB = 2.23, RR = 5.07, WALL = 0.30, YIN = 0.62, LMAX = H - 0.42;   // LMAX: near the rim, or the low camera sees no coffee
const float PI = 3.14159265;

float smax(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (a - b) / k, 0.0, 1.0); return mix(b, a, h) + k * h * (1.0 - h); }
float smin(float a, float b, float k) { return -smax(-a, -b, k); }

// the side, fitted to the photo's outline: the radius rises from the base as 1 - (1 - h)^3.15 (every measured point
// gave an exponent between 3.0 and 3.3), so the bowl is nearly upright under the rim and meets its base at an angle
float rOut(float y) { float h = clamp(y / H, 0.0, 1.0); return RB + (RR - RB) * (1.0 - pow(1.0 - h, 3.15)); }
// thrown by hand: the upper bowl is very slightly out of round (a fraction of a millimetre)
float wob(vec3 p) { float a = atan(p.z, p.x); return (0.022 * sin(3.0 * a + 1.3) + 0.012 * sin(5.0 * a + 0.4)) * smoothstep(0.25 * H, H, p.y); }
float sdSide(vec3 p) {        // the bowl's outside, not yet cut at the rim; the base's edge slightly rounded
  float rho = length(p.xz), y = p.y, e = 0.01;
  float dr = (rOut(y + e) - rOut(y - e)) / (2.0 * e);
  return smax((rho - rOut(y) - wob(p)) / sqrt(1.0 + dr * dr), -y, 0.10);
}
float rIn(float y) { return rOut(y) - WALL; }   // close enough near the rim, where the coffee and the shading use it
float sdCav(vec3 p) { return smax(sdSide(p) + WALL, YIN - p.y, 0.45); }   // the inside of the bowl (negative inside): an even wall
const vec3 HND_C = vec3(5.54, 2.85, 0.0);     // the loop, measured on the photo: about 3 cm tall, 1.7 cm out from the rim,
const vec2 HND_AB = vec2(1.00, 1.25);         // its inner side tilted to follow the body down (HND_TILT), so it joins just
const float HND_TILT = 0.28;                  // under the rim and again about 60% of the way down
const vec2 HND_T = vec2(0.26, 0.19);          // a flat strap: wider in the loop's plane than deep
float sdHandle(vec3 p) {
  vec3 q = p - HND_C;
  float c = cos(HND_TILT), s = sin(HND_TILT);
  q.xy = vec2(c * q.x - s * q.y, s * q.x + c * q.y);
  float e = length(q.xy / HND_AB);
  float g = max(length(q.xy / (HND_AB * HND_AB)) / max(e, 1e-4), 1.0 / HND_AB.y);
  float dp = e < 1.0 ? (e - 1.0) * HND_AB.x : (e - 1.0) / g;   // inside the loop: a safe underestimate
  return (length(vec2(dp, q.z) / HND_T) - 1.0) * HND_T.y;
}
float sdCup(vec3 p) {
  float body = smax(sdSide(p), p.y - H, 0.05);
  body = smin(body, sdHandle(p), 0.15);       // the handle grows out of the wall
  return smax(body, -sdCav(p), 0.10);         // and nothing of it shows inside; the rim's lip comes out rounded
}

// ------------------------------------------------------------------ noise
float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float fbm3(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
// value noise whose lattice wraps every `per` cells in y, so steam rising by a whole period loops
float hashW(vec3 i, float per) { i.y = mod(i.y, per); return hash3(i); }
float vnoiseW(vec3 x, float per) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hashW(i, per), hashW(i + vec3(1, 0, 0), per), f.x), mix(hashW(i + vec3(0, 1, 0), per), hashW(i + vec3(1, 1, 0), per), f.x), f.y),
             mix(mix(hashW(i + vec3(0, 0, 1), per), hashW(i + vec3(1, 0, 1), per), f.x), mix(hashW(i + vec3(0, 1, 1), per), hashW(i + vec3(1, 1, 1), per), f.x), f.y), f.z);
}
float fbmW(vec3 p, float per) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoiseW(p, per); p = vec3(p.x * 2.0 + 13.7, p.y * 2.0, p.z * 2.0 + 5.3); per *= 2.0; a *= 0.5; } return s; }
// the glaze's specks: in some cells of a 0.2 cm lattice, one small round dot, 0.35-0.9 mm across
float speck(vec3 p) {
  vec3 c = floor(p * 5.0), f = p * 5.0 - c;
  if (hash3(c + 11.3) > 0.75) return 0.0;
  vec3 o = vec3(hash3(c + 1.7), hash3(c + 5.1), hash3(c + 9.4)) * 0.5 + 0.25;
  float rd = 0.09 + 0.13 * pow(hash3(c + 3.3), 2.0);   // mostly small, a few larger
  return smoothstep(rd, rd * 0.6, length(f - o));
}
float ign(vec2 px) { return fract(52.9829189 * fract(dot(px, vec2(0.06711056, 0.00583715)))); }   // interleaved gradient noise

// ------------------------------------------------------------------ the pour over time
float shotT() { return uMode == 0 ? uT : T_END; }   // modes 1 and 2: the settled cup
float level(float t) {
  float k = clamp((t - (T_START + 0.15)) / (T_STOP - T_START), 0.0, 1.0);
  return YIN + (LMAX - YIN) * (1.0 - pow(1.0 - k, 2.4));
}
const vec2 HIT = vec2(0.42, 0.28);           // where the stream meets the surface (x, z)
float pourAmt(float t) { return smoothstep(T_START + 0.18, T_START + 0.35, t) * (1.0 - smoothstep(T_STOP - 0.05, T_STOP + 0.35, t)); }
float cremaAmt(float t) { return smoothstep(T_START + 0.5, T_START + 2.2, t); }

// stream SDF: a falling column with a head, a tail after the stop, a slight wobble and beading near the end
float sdStream(vec3 p, float t, float L) {
  float head = 26.0 - 0.5 * G * pow(max(t - T_START, 0.0), 2.0);
  float bottom = max(head, L - 0.2);
  float top = t < T_STOP ? 60.0 : 26.0 - 0.5 * G * pow(t - T_STOP, 2.0) - 30.0 * (t - T_STOP);
  if (t < T_START || top <= bottom) return 1e3;
  float y = p.y;
  float thin = 1.0 - 0.55 * smoothstep(T_STOP - 0.45, T_STOP, t);
  float r = (0.125 + 0.018 * sin(y * 2.3 + t * 11.0)) * thin;
  r *= 1.0 + 0.25 * smoothstep(T_STOP - 0.35, T_STOP, t) * sin(y * 9.0 - t * 70.0);   // beads as it breaks
  r *= mix(1.0, 1.25, smoothstep(L + 0.6, L, y));                                       // flares where it lands
  vec2 c = HIT + vec2(0.035 * sin(y * 0.9 + t * 7.0), 0.03 * cos(y * 0.7 + t * 5.0));
  float d = length(p.xz - c) - r;
  float cap = max(bottom - y, y - top);
  return max(d, cap);
}
// the last two drips
float sdDrips(vec3 p, float t, float L) {
  float d = 1e3;
  for (int i = 0; i < 2; i++) {
    float t0 = T_STOP + 0.32 + 0.38 * float(i);
    float dt = t - t0;
    if (dt < 0.0) continue;
    float y = 22.0 - 0.5 * G * dt * dt - 25.0 * dt;
    if (y < L) continue;
    d = min(d, length((p - vec3(HIT.x, y, HIT.y)) * vec3(1.0, 0.75, 1.0)) - 0.085);
  }
  return d;
}
float sdLiquid(vec3 p, float L) { return max(sdCav(p) + 0.01, p.y - L); }

// ------------------------------------------------------------------ the cup's scene (raymarched)
// materials: 1 stoneware, 3 coffee surface, 4 stream / drips
bool gNoStream = false;   // shadow and occlusion rays ignore the thin stream (its bound shaded the crema)
bool gOnlyHandle = false; // shadow rays from the bowl's outside: the bowl's own shading makes its terminator (see shadeHit)
bool gExact = false;      // shadow rays need the cup's true distance: the bound's (smaller) one reads as a near miss, a false penumbra
vec2 map(vec3 p, float t, float L) {
  vec2 r = vec2(1e3, 0.0);
  float bc = max(length(p.xz - vec2(0.85, 0.0)) - 6.6, max(-p.y - 0.1, p.y - H - 0.15));   // bound: the bowl and its handle
  if (bc < 0.6 || gExact) {
    r = vec2(gOnlyHandle ? sdHandle(p) : sdCup(p) * (gExact ? 1.0 : 0.8), 1.0);   // the 0.8 is a marching margin; shadows and occlusion want the true distance
    float l = sdLiquid(p, L);
    if (l < r.x) r = vec2(l, 3.0);
  } else r = vec2(bc, 1.0);
  if (!gNoStream && t > T_START && t < T_STOP + 0.95) {
    float bs = length(p.xz - HIT) - 0.45;
    float s = bs < 0.3 ? min(sdStream(p, t, L), sdDrips(p, t, L)) * 0.8 : bs;
    if (s < r.x) r = vec2(s, 4.0);
  }
  return r;
}
vec3 normalAt(vec3 p, float t, float L) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy, t, L).x - map(p - e.xyy, t, L).x,
                        map(p + e.yxy, t, L).x - map(p - e.yxy, t, L).x,
                        map(p + e.yyx, t, L).x - map(p - e.yyx, t, L).x));
}
// march only where the cup can be: the ray's span inside a box around it
vec2 march(vec3 ro, vec3 rd, float t, float L, float tmax) {
  vec3 bmin = vec3(-5.5, -0.2, -5.5), bmax = vec3(7.3, 62.0, 5.5);
  vec3 inv = 1.0 / rd, t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), max(tn.z, 0.0)), b = min(min(tf.x, tf.y), min(tf.z, tmax));
  if (a >= b) return vec2(-1.0, 0.0);
  float d = a;
  for (int i = 0; i < 200; i++) {
    vec3 p = ro + rd * d;
    vec2 h = map(p, t, L);
    if (h.x < 0.0008 * d) return vec2(d, h.y);
    d += h.x;
    if (d > b) break;
  }
  return vec2(-1.0, 0.0);
}
float softShadow(vec3 ro, vec3 rd, float t, float L, float k, float jit) {
  // only the cup casts: skip rays that miss its bound
  vec3 bmin = vec3(-8.5, -0.2, -8.5), bmax = vec3(10.3, 9.0, 8.5);   // the cup and its penumbra
  vec3 inv = 1.0 / rd, t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), max(tn.z, 0.0)), b = min(min(tf.x, tf.y), tf.z);
  if (a >= b) return 1.0;
  gNoStream = true; gExact = true;
  // the closest pass between two samples, estimated from both
  // the start and the steps are jittered per pass: rays skimming the cup's own surface otherwise step its shadow's edge
  float res = 1.0, d = max(a, 0.03) + 0.03 * jit, ph = 1e10;
  for (int i = 0; i < 80; i++) {
    float h = map(ro + rd * d, t, L).x;
    float y = h * h / (2.0 * ph), e = sqrt(max(h * h - y * y, 0.0));
    res = min(res, k * e / max(d - y, 1e-4));
    ph = h;
    d += clamp(h, 0.02, 0.5) * (0.75 + 0.5 * fract(jit + float(i) * 0.618));
    if (res < 0.002 || d > b) break;
  }
  gNoStream = false; gExact = false;
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n, float t, float L) {
  float o = 0.0, s = 1.0;
  gNoStream = true; gExact = true;
  for (int i = 1; i <= 5; i++) { float h = 0.05 * float(i) * float(i); o += (h - map(p + n * h, t, L).x) * s; s *= 0.6; }
  gNoStream = false; gExact = false;
  return clamp(1.0 - 1.6 * o, 0.0, 1.0);
}

// ------------------------------------------------------------------ the room: window wall, counter, walls
const float XW = -26.0;          // the window wall's glass plane (the counter runs along it)
const float PD = 2.5;            // the posts' depth, into the room
const float SP = 40.7, PW = 17.0; // post spacing and width, along z: the cup in a beam, a post behind it
const float Z0 = -3.6;            // post phase: the cup sits in a band of sun
const float HEAD = 230.0;        // top of the glass; the counter is the sill
const float XR = 170.0, YC = 290.0, ZF = -420.0;   // right wall, ceiling, far wall
const vec3 SUN = normalize(vec3(-0.86, 0.34, -0.12));   // toward the sun: low, from the window's side
const vec3 SUNC = vec3(1.0, 0.63, 0.32) * 4.2;          // low, amber, golden
const vec3 GLASS = vec3(1.0, 0.46, 0.15) * 0.46;          // late light outside: a dim amber sky
const vec3 AMB = vec3(0.020, 0.013, 0.008);              // a dark room              // the room's warm bounce

float postMask(float z, float soft) {
  float u = mod(z - Z0, SP) - 0.5 * SP;
  return smoothstep(0.5 * PW + soft, 0.5 * PW - soft, abs(u));
}
// how much sun reaches p through the window (0..1), soft-edged by distance
float sunVis(vec3 p, float jit) {
  if (p.x <= XW) return 1.0;
  float s = (XW - p.x) / SUN.x;
  vec3 q = p + SUN * s;
  float soft = 0.35 + 0.014 * s;
  q.z += (jit - 0.5) * soft * 0.8;
  float win = smoothstep(-soft, soft, q.y) * smoothstep(HEAD + soft, HEAD - soft, q.y);
  return win * (1.0 - postMask(q.z, soft));
}
vec3 woodAlb(vec2 xz) {
  float pw = 10.5;
  float u = (xz.x - XW) / pw, k = floor(u), f = fract(u);
  float hk = hash1(k + 3.0);
  float z = xz.y + hk * 400.0;
  float grain = fbm3(vec3((xz.x - XW) * 0.55 + k * 7.0, z * 0.035, k * 1.7));
  float fine = vnoise(vec3((xz.x - XW) * 3.2 + k * 3.0, z * 0.25, 4.0));
  vec3 a = mix(vec3(0.26, 0.120, 0.050), vec3(0.40, 0.200, 0.090), hk);
  vec3 c = a * (0.72 + 0.50 * grain) * (0.92 + 0.12 * fine);
  float seam = smoothstep(0.0, 0.025, f) * smoothstep(1.0, 0.975, f);
  float e = fract(z / 160.0);
  seam *= smoothstep(0.0, 0.004, e) * smoothstep(1.0, 0.996, e);
  return c * mix(0.30, 1.0, seam);
}
// what a ray from o in direction d sees of the room (no cup): returns linear colour, writes the distance
vec3 room(vec3 o, vec3 d, float jit, out float dist, bool full);
vec3 windowSeen(vec3 o, vec3 d, out float dist) {
  // the posts' inner face, then the glass behind; a post's side if the ray crosses one in between
  float ti = (XW + PD - o.x) / d.x, tg = (XW - o.x) / d.x;
  vec3 pi = o + d * ti, pg = o + d * tg;
  dist = ti;
  if (pi.y > HEAD) return vec3(0.050, 0.034, 0.024);                 // the wall above the window
  if (postMask(pi.z, 0.15) > 0.5) return vec3(0.030, 0.012, 0.005);  // a post, facing the room: in shadow
  // a post's side, if the ray meets one between the posts' face and the glass
  float hw = 0.5 * PW / SP, ui = (pi.z - Z0) / SP - 0.5, ug = (pg.z - Z0) / SP - 0.5, sg = sign(ug - ui);
  float kb = sg > 0.0 ? floor(ui) + 1.0 : ceil(ui) - 1.0;
  float ub = kb - sg * hw;
  if ((ub - ui) * sg < abs(ug - ui)) {
    dist = mix(ti, tg, (ub - ui) / (ug - ui));
    return vec3(0.050, 0.020, 0.008) * (1.0 + 0.6 * smoothstep(0.0, 1.0, (ub - ui) / (ug - ui)));   // warmer toward the glass
  }
  dist = tg;
  if (pg.y > HEAD) return vec3(0.050, 0.034, 0.024);
  // outside: a bright morning, a soft hint of trees (out of focus anyway)
  float grad = 0.85 + 0.25 * smoothstep(0.0, HEAD, pg.y);
  float trees = fbm3(vec3(pg.z * 0.012, pg.y * 0.016, 3.0));
  return GLASS * grad * mix(vec3(1.0), vec3(0.80, 0.72, 0.52), smoothstep(0.45, 0.75, trees) * smoothstep(HEAD, 40.0, pg.y) * 0.55);
}
vec3 room(vec3 o, vec3 d, float jit, out float dist, bool full) {
  float best = 1e5; vec3 c = vec3(0);
  // counter (the floor of this little world), at y = 0, between the window and the right wall
  if (d.y < 0.0) {
    float tc = -o.y / d.y;
    vec3 p = o + d * tc;
    if (p.x > XW && tc < best) {
      best = tc;
      vec3 alb = woodAlb(p.xz);
      float sv = sunVis(p, jit);
      c = alb * (SUNC * sv * SUN.y + AMB * 1.3 + GLASS * 0.010 * smoothstep(60.0, 0.0, p.x - XW));
      if (full) {   // the varnish: a soft, warm reflection of the window
        float g = (fbm3(vec3(p.xz * 0.12, 7.0)) - 0.5) * 0.05;
        vec3 n = normalize(vec3(g, 1.0, g * 0.7));
        vec3 r = reflect(d, n);
        float F = 0.035 + 0.6 * pow(1.0 - max(dot(-d, n), 0.0), 5.0);
        float td; vec3 rc = r.x < 0.0 ? windowSeen(p, r, td) : vec3(0.06, 0.04, 0.028);
        c += rc * F * 0.20;
      }
    }
  }
  // the window wall
  if (d.x < 0.0) {
    float tw = (XW + PD - o.x) / d.x;
    if (tw > 0.0 && tw < best) {
      vec3 p = o + d * tw;
      if (p.y > 0.0 && p.y < YC) { float td; vec3 wc = windowSeen(o, d, td); best = td; c = wc; }
    }
  }
  // right wall, ceiling, far wall: plaster, with the sun's bands where they reach
  float tr = d.x > 0.0 ? (XR - o.x) / d.x : 1e5;
  float tcl = d.y > 0.0 ? (YC - o.y) / d.y : 1e5;
  float tf = d.z < 0.0 ? (ZF - o.z) / d.z : 1e5;
  float tb = d.z > 0.0 ? (260.0 - o.z) / d.z : 1e5;
  float tw2 = min(min(tr, tcl), min(tf, tb));
  if (tw2 < best) {
    best = tw2;
    vec3 p = o + d * tw2;
    vec3 n = tw2 == tr ? vec3(-1, 0, 0) : tw2 == tcl ? vec3(0, -1, 0) : tw2 == tf ? vec3(0, 0, 1) : vec3(0, 0, -1);
    vec3 alb = vec3(0.26, 0.20, 0.15);
    float sv = sunVis(p, jit);
    c = alb * (SUNC * sv * max(dot(n, SUN), 0.0) * 0.8 + AMB * 1.1);
  }
  dist = best;
  return c;
}
// the environment the cup reflects, seen from its middle
vec3 env(vec3 d) { float dd; return room(vec3(0.0, 3.5, 0.0), d, 0.5, dd, false); }

float ggx(vec3 n, vec3 v, vec3 l, float rough) {
  vec3 h = normalize(v + l); float a = rough * rough, a2 = a * a;
  float nh = max(dot(n, h), 0.0), nl = max(dot(n, l), 0.0), nv = max(dot(n, v), 0.001);
  float dd = nh * nh * (a2 - 1.0) + 1.0; float D = a2 / (PI * dd * dd);
  float k = (rough + 1.0) * (rough + 1.0) / 8.0; float Gs = (nl / (nl * (1.0 - k) + k)) * (nv / (nv * (1.0 - k) + k));
  return D * Gs / (4.0 * nv + 0.001);
}

// ------------------------------------------------------------------ the coffee's surface
vec3 cremaColor(vec3 p, float t, float L) {
  vec2 d0 = p.xz - HIT;

  float spin = 1.6 * smoothstep(T_START, T_STOP + 1.0, t);             // the stream's push turns the crema, then it settles
  float a = spin / (0.7 + r);

// ------------------------------------------------------------------ steam (loops every LOOP seconds), lit by the sun
vec4 steam(vec3 ro, vec3 rd, float tHit, float t, float jit) {

  float mu = dot(rd, SUN);
  float phase = 0.35 + 2.4 * pow(0.5 + 0.5 * mu, 5.0);        // bright looking toward the sun
  for (float i = 0.0; i < 32.0; i++) {
    vec3 p = ro + rd * (n0 + (i + jit) * dt);
    float hy = p.y - (H - 0.3);
    float rad = length(p.xz - vec2(0.15 * sin(hy * 0.45), 0.0)) / (3.0 + hy * 0.24);
    float env = smoothstep(0.0, 0.9, hy) * exp(-hy / 4.2) * exp(-rad * rad * 2.4);
    env *= smoothstep(9.0, 6.8, length(p.xz)) * smoothstep(y1, y1 - 5.0, p.y);   // nothing left at the march's edges

}

// ------------------------------------------------------------------ shading the cup
vec3 shadeHit(vec3 p, vec3 rd, float m, float t, float L, float jit) {
  vec3 n = normalAt(p, t, L), v = -rd;
  // the bowl's outside takes shadow and occlusion only from the handle: rays grazing the bowl (widest at the rim) banded
  // its own shadow, the wrapped light below already darkens it past the terminator, and a convex outside occludes
  // nothing of itself; inside, the rim's shadow and the bowl's occlusion count
  bool outside = m < 1.5 && length(p.xz) > rIn(p.y) + 0.06 && dot(n.xz, p.xz) > 0.0;
  gOnlyHandle = outside;

    alb = mix(alb, vec3(0.30, 0.25, 0.21), 0.85 * speck(p));                    // fine, sparse iron specks

    float foot = (1.0 - smoothstep(0.10, 0.20, p.y)) * step(rIn(p.y) + 0.06, length(p.xz));   // and the foot, unglazed

    if (length(p.xz) < rOut(p.y) + 0.08) {                                     // the bowl (not the handle): faint throwing lines

    c += sun * ggx(n, v, SUN, 0.08) * 0.9 * (1.0 - raw);

    float back = pow(0.5 + 0.5 * dot(rd, SUN), 3.0);                   // looking toward the sun
    vec3 glow = vec3(0.95, 0.45, 0.10) * sv * (0.15 + 1.6 * back) * edge * edge * (0.5 + 0.5 * tiger);
    c = body * (ambient(n) * 2.0 + sun * max(dot(n, SUN) * 0.5 + 0.5, 0.0) * 0.25) + glow * 0.45;
    c += F * env(reflect(rd, n)) * 0.8;

// ------------------------------------------------------------------ the haze: the sun's beams in the air
const float SIG = 0.00028;        // scattering per cm
vec3 haze(vec3 ro, vec3 rd, float tEnd, float jit) {

// ------------------------------------------------------------------ one camera ray

void main() {

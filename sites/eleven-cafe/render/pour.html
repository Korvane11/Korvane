<!doctype html>
<!-- Eleven Cafē: the espresso pour, rendered offline frame by frame (see render_pour.cjs).
     A white ribbed tulip cup with a gold ring handle (their logo's cup, in 3D) on a dark
     counter; espresso pours in, crema rises, the pour stops, steam rises.
     window.renderFrame(t, layout, passes, mode) -> PNG data URL.
     mode 0 = the intro shot (t from 0), mode 1 = the steam loop (t in [0, LOOP)). -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT;        // shot time, seconds
uniform int uMode;       // 0 intro, 1 loop
uniform int uLayout;     // 0 landscape, 1 portrait
uniform vec2 uJit;
uniform sampler2D uBase;   // mode 1: the still scene (linear rgb, alpha = hit distance)
out vec4 outC;

// ------------------------------------------------------------------ timing
const float T_START = 0.55;   // the stream leaves the spout (off frame)
const float T_STOP  = 3.05;   // the stream breaks
const float T_END   = 4.2916667;   // = 103 / 24: the intro's last frame == the loop's first frame
const float LOOP    = 6.0;    // the steam loop's length
const float G = 981.0;        // cm/s^2

// ------------------------------------------------------------------ cup geometry (cm)
const float H = 6.2, FOOT = 0.55, WALL = 0.26, YIN = 0.95, LMAX = 5.30;
const float PI = 3.14159265;

float rBase(float y) {
  if (y < FOOT) return 1.98 - 0.05 * smoothstep(0.0, FOOT, y);
  float h = clamp((y - FOOT) / (H - FOOT), 0.0, 1.0);
  return 1.90 + 1.52 * pow(h, 1.45);
}
// seven bars on the bowl, as on their logo: six grooves between them and one above the foot
float grooves(float y) {
  float band = (H - FOOT) / 7.0;
  float k = clamp(floor((y - FOOT) / band + 0.5), 0.0, 6.0);
  float yk = FOOT + band * k + (k == 0.0 ? 0.04 : 0.0);
  float d = abs(y - yk) / 0.17;
  return 0.16 * smoothstep(1.0, 0.42, d);       // a flat-bottomed groove with soft shoulders (no sparkle)
}
float rOut(float y) { return rBase(y) - grooves(y); }
float rIn(float y) { return rBase(y) - WALL; }

float smax(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (a - b) / k, 0.0, 1.0); return mix(b, a, h) + k * h * (1.0 - h); }
float smin(float a, float b, float k) { return -smax(-a, -b, k); }

float sdCup(vec3 p) {
  float rho = length(p.xz);
  float y = p.y;
  float e = 0.01;
  float ro = rOut(y), dro = (rOut(y + e) - rOut(y - e)) / (2.0 * e);
  float dOut = (rho - ro) / sqrt(1.0 + dro * dro);
  float body = smax(dOut, max(-y, y - H), 0.06);
  float ri = rIn(y), dri = (rIn(y + e) - rIn(y - e)) / (2.0 * e);
  float dIn = (rho - ri) / sqrt(1.0 + dri * dri);
  float cav = smax(dIn, YIN - y, 0.25);
  return smax(body, -cav, 0.08);
}
const vec3 RING_C = vec3(-3.40, 4.30, 0.0);
const float RING_R = 0.86, RING_r = 0.165;
float sdRing(vec3 p) {
  vec3 q = p - RING_C;
  vec2 t = vec2(length(q.xy) - RING_R, q.z);
  return length(t) - RING_r;
}

// ------------------------------------------------------------------ noise
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
// value noise whose lattice wraps every `per` cells in y, so steam rising by a whole period loops
float hashW(vec3 i, float per) { i.y = mod(i.y, per); return hash3(i); }
float vnoiseW(vec3 x, float per) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hashW(i, per), hashW(i + vec3(1, 0, 0), per), f.x), mix(hashW(i + vec3(0, 1, 0), per), hashW(i + vec3(1, 1, 0), per), f.x), f.y),
             mix(mix(hashW(i + vec3(0, 0, 1), per), hashW(i + vec3(1, 0, 1), per), f.x), mix(hashW(i + vec3(0, 1, 1), per), hashW(i + vec3(1, 1, 1), per), f.x), f.y), f.z);
}
float fbmW(vec3 p, float per) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoiseW(p, per); p = vec3(p.x * 2.0 + 13.7, p.y * 2.0, p.z * 2.0 + 5.3); per *= 2.0; a *= 0.5; } return s; }

// ------------------------------------------------------------------ the pour over time
float shotT() { return uMode == 0 ? uT : T_END; }   // modes 1 and 2: the settled cup
float level(float t) {
  // the narrow bottom fills fast; from this angle the coffee shows once it is within ~2.7 cm of the rim
  float k = clamp((t - (T_START + 0.15)) / (T_STOP - T_START), 0.0, 1.0);
  return YIN + (LMAX - YIN) * (1.0 - pow(1.0 - k, 2.4));
}
const vec2 HIT = vec2(0.42, 0.28);           // where the stream meets the surface (x, z)
float pourAmt(float t) { return smoothstep(T_START + 0.18, T_START + 0.35, t) * (1.0 - smoothstep(T_STOP - 0.05, T_STOP + 0.35, t)); }
float cremaAmt(float t) { return smoothstep(T_START + 0.5, T_START + 2.2, t); }

// stream SDF: a falling column with a head, a tail after the stop, a slight wobble and beading near the end
float sdStream(vec3 p, float t, float L) {
  float head = 26.0 - 0.5 * G * pow(max(t - T_START, 0.0), 2.0);
  float bottom = max(head, L - 0.2);
  float top = t < T_STOP ? 60.0 : 26.0 - 0.5 * G * pow(t - T_STOP, 2.0) - 30.0 * (t - T_STOP);
  if (t < T_START || top <= bottom) return 1e3;
  float y = p.y;
  float thin = 1.0 - 0.55 * smoothstep(T_STOP - 0.45, T_STOP, t);
  float r = (0.125 + 0.018 * sin(y * 2.3 + t * 11.0)) * thin;
  r *= 1.0 + 0.25 * smoothstep(T_STOP - 0.35, T_STOP, t) * sin(y * 9.0 - t * 70.0);   // beads as it breaks
  r *= mix(1.0, 1.25, smoothstep(L + 0.6, L, y));                                       // flares where it lands
  vec2 c = HIT + vec2(0.035 * sin(y * 0.9 + t * 7.0), 0.03 * cos(y * 0.7 + t * 5.0));
  float d = length(p.xz - c) - r;
  float cap = max(bottom - y, y - top);
  return max(d, cap) - 0.0;
}
// the last two drips
float sdDrips(vec3 p, float t, float L) {
  float d = 1e3;
  for (int i = 0; i < 2; i++) {
    float t0 = T_STOP + 0.32 + 0.38 * float(i);
    float dt = t - t0;
    if (dt < 0.0) continue;
    float y = 22.0 - 0.5 * G * dt * dt - 25.0 * dt;
    if (y < L) continue;
    d = min(d, length((p - vec3(HIT.x, y, HIT.y)) * vec3(1.0, 0.75, 1.0)) - 0.085);
  }
  return d;
}
float sdLiquid(vec3 p, float L) {
  float rho = length(p.xz);
  return max(max(rho - rIn(p.y) + 0.01, p.y - L), YIN - p.y);
}

// ------------------------------------------------------------------ scene
// materials: 1 ceramic, 2 gold, 3 coffee surface, 4 stream / drips
bool gNoStream = false;   // shadow and occlusion rays ignore the thin stream (its bound shaded the crema)
vec2 map(vec3 p, float t, float L) {
  vec2 r = vec2(1e3, 0.0);
  float bc = max(length(p.xz) - 3.7, max(-p.y - 0.1, p.y - H - 0.15));      // the cup's bounding cylinder
  if (bc < 0.6) {
    r = vec2(sdCup(p) * 0.8, 1.0);
    float l = sdLiquid(p, L);
    if (l < r.x) r = vec2(l, 3.0);
  } else r = vec2(bc, 1.0);
  float bg = length(p - RING_C) - 1.15;
  float g = bg < 0.6 ? sdRing(p) : bg;
  if (g < r.x) r = vec2(g, 2.0);
  if (!gNoStream && t > T_START && t < T_STOP + 0.95) {
    float bs = length(p.xz - HIT) - 0.45;
    float s = bs < 0.3 ? min(sdStream(p, t, L), sdDrips(p, t, L)) * 0.8 : bs;
    if (s < r.x) r = vec2(s, 4.0);
  }
  return r;
}
vec3 normalAt(vec3 p, float t, float L) {
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(map(p + e.xyy, t, L).x - map(p - e.xyy, t, L).x,
                        map(p + e.yxy, t, L).x - map(p - e.yxy, t, L).x,
                        map(p + e.yyx, t, L).x - map(p - e.yyx, t, L).x));
}
vec2 march(vec3 ro, vec3 rd, float t, float L, float tmax) {
  float d = 0.0;
  for (int i = 0; i < 220; i++) {
    vec3 p = ro + rd * d;
    vec2 h = map(p, t, L);
    if (h.x < 0.0008 * d) return vec2(d, h.y);
    d += h.x;
    if (d > tmax) break;
  }
  return vec2(-1.0, 0.0);
}
float softShadow(vec3 ro, vec3 rd, float t, float L, float k) {
  gNoStream = true;
  float res = 1.0, d = 0.03;
  for (int i = 0; i < 32; i++) {
    float h = map(ro + rd * d, t, L).x;
    res = min(res, k * h / d);
    d += clamp(h, 0.03, 0.9);
    if (res < 0.002 || d > 30.0) break;
  }
  gNoStream = false;
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n, float t, float L) {
  float o = 0.0, s = 1.0;
  gNoStream = true;
  for (int i = 1; i <= 5; i++) { float h = 0.05 * float(i) * float(i); o += (h - map(p + n * h, t, L).x) * s; s *= 0.6; }
  gNoStream = false;
  return clamp(1.0 - 1.6 * o, 0.0, 1.0);
}

// ------------------------------------------------------------------ light and environment
const vec3 KEY = normalize(vec3(-0.55, 0.85, -0.65));   // big softbox behind, left, above
const vec3 FILL = normalize(vec3(0.75, 0.35, 0.85));    // small card front right
const vec3 KEYC = vec3(1.0, 0.94, 0.86) * 2.6;
const vec3 FILLC = vec3(0.86, 0.90, 1.0) * 0.55;
vec3 envR(vec3 d, float blur);
vec3 env(vec3 d) { return envR(d, 0.0); }
vec3 envR(vec3 d, float blur) {
  vec3 c = vec3(0.012, 0.011, 0.010) + vec3(0.03, 0.026, 0.022) * max(d.y, 0.0);
  // the key softbox, a soft-edged rectangle
  vec3 kx = normalize(cross(KEY, vec3(0, 1, 0))), ky = cross(kx, KEY);
  float a = dot(d, KEY);
  if (a > 0.0) { vec2 q = vec2(dot(d, kx), dot(d, ky)) / a; float m = smoothstep(0.62 + 0.5 * blur, 0.48 - 0.3 * blur, abs(q.x)) * smoothstep(0.42 + 0.5 * blur, 0.30 - 0.25 * blur, abs(q.y)); c += vec3(1.0, 0.95, 0.88) * 5.0 * m / (1.0 + 1.5 * blur); }
  // the fill card
  vec3 fx = normalize(cross(FILL, vec3(0, 1, 0))), fy = cross(fx, FILL);
  float b = dot(d, FILL);
  if (b > 0.0) { vec2 q = vec2(dot(d, fx), dot(d, fy)) / b; float m = smoothstep(0.30, 0.18, abs(q.x)) * smoothstep(0.55, 0.40, abs(q.y)); c += vec3(0.85, 0.9, 1.0) * 1.1 * m; }
  // a warm practical light far behind, for the gold
  float w = max(dot(d, normalize(vec3(0.35, 0.25, -1.0))), 0.0);
  c += vec3(1.0, 0.62, 0.22) * 0.9 * pow(w, 40.0) * (1.0 - blur);
  return c;
}
float ggx(vec3 n, vec3 v, vec3 l, float rough) {
  vec3 h = normalize(v + l); float a = rough * rough, a2 = a * a;
  float nh = max(dot(n, h), 0.0), nl = max(dot(n, l), 0.0), nv = max(dot(n, v), 0.001);
  float dd = nh * nh * (a2 - 1.0) + 1.0; float D = a2 / (PI * dd * dd);
  float k = (rough + 1.0) * (rough + 1.0) / 8.0; float Gs = (nl / (nl * (1.0 - k) + k)) * (nv / (nv * (1.0 - k) + k));
  return D * Gs / (4.0 * nv + 0.001);
}
vec3 fres(vec3 f0, float c) { return f0 + (1.0 - f0) * pow(1.0 - c, 5.0); }

// the background: dark, a warm wall glow and out-of-focus lights of the cafe behind
vec3 background(vec2 s) {         // s: screen coords, y up, height = 1
  vec3 c = vec3(0.010, 0.0095, 0.009);
  c += vec3(0.030, 0.023, 0.016) * exp(-pow(length(s - vec2(-0.25, 0.25)) / 0.75, 2.0));
  vec2 B[6] = vec2[6](vec2(-0.62, 0.30), vec2(-0.38, 0.40), vec2(0.70, 0.36), vec2(0.88, 0.12), vec2(-0.80, 0.05), vec2(0.42, 0.44));
  float R[6] = float[6](0.062, 0.045, 0.052, 0.038, 0.034, 0.03);
  for (int i = 0; i < 6; i++) {
    vec2 b = B[i]; if (uLayout == 1) b = vec2(b.x * 0.45, b.y + 0.12);
    float d = length(s - b) / R[i];
    float m = smoothstep(1.0, 0.78, d) * (0.6 + 0.4 * smoothstep(0.3, 0.95, d));
    c += vec3(1.0, 0.60, 0.22) * 0.085 * m * (i == 2 ? 0.7 : 1.0) * (i == 4 ? 0.0 : 1.0);
  }
  return c;
}

// ------------------------------------------------------------------ the coffee's surface
vec3 cremaColor(vec3 p, float t, float L) {
  vec2 q = p.xz;
  float r = length(q);
  float spin = 1.4 * smoothstep(T_START, T_STOP + 0.8, t);            // the crema turns, then settles
  float a = spin / (0.8 + r);
  q = mat2(cos(a), -sin(a), sin(a), cos(a)) * q;
  float n = fbm(vec3(q * 2.2, 3.1));
  float fleck = smoothstep(0.58, 0.72, fbm(vec3(q * 7.5, 9.7)));
  vec3 light = vec3(0.62, 0.38, 0.19), mid = vec3(0.46, 0.26, 0.12), dark = vec3(0.18, 0.09, 0.04);
  vec3 crema = mix(mid, light, smoothstep(0.35, 0.7, n));
  crema = mix(crema, dark * 1.6, fleck * 0.55);
  crema *= 0.82 + 0.25 * smoothstep(rIn(L), rIn(L) * 0.35, r);   // darker at the wall
  vec3 espresso = vec3(0.07, 0.035, 0.016);
  float c = cremaAmt(t);
  float hit = exp(-dot(p.xz - HIT, p.xz - HIT) / 0.35) * pourAmt(t);
  return mix(espresso, crema, c * (1.0 - 0.85 * hit));
}
vec3 surfNormal(vec3 p, float t) {
  vec2 d = p.xz - HIT; float r = length(d) + 1e-4;
  float amp = 0.05 * pourAmt(t) + 0.02 * exp(-4.0 * max(t - T_STOP, 0.0)) * step(T_STOP, t) * (1.0 - step(T_END - 0.001, t));
  float w = cos(r * 16.0 - t * 34.0) * exp(-r * 1.3) * amp * 16.0;
  vec2 g = d / r * w;
  // meniscus: tilt up near the wall
  float rho = length(p.xz), ri = rIn(p.y);
  vec2 m = p.xz / max(rho, 1e-3) * 0.9 * smoothstep(ri - 0.35, ri, rho);
  return normalize(vec3(-g.x - m.x, 1.0, -g.y - m.y));
}

// ------------------------------------------------------------------ steam (loops every LOOP seconds)
vec4 steam(vec3 ro, vec3 rd, float tHit, float t) {
  float k = uMode == 0 ? smoothstep(T_STOP - 0.6, T_END, uT) : 1.0;
  if (k <= 0.0) return vec4(0);
  // march the column above the cup
  float y0 = H - 0.6, y1 = H + 11.0;
  float acc = 0.0; vec3 col = vec3(0);
  float tau = uMode == 0 ? (uT - T_END) : uT;       // the intro ends where the loop starts
  float per = 6.0;                                  // lattice cells per period in y
  float rise = per / LOOP;                          // noise units per second: one period per loop
  float n0 = 0.0, n1 = 30.0;
  // ray range where y in [y0, y1]
  if (abs(rd.y) > 1e-4) { float a = (y0 - ro.y) / rd.y, b = (y1 - ro.y) / rd.y; n0 = max(min(a, b), 0.0); n1 = max(a, b); }
  // and inside the cylinder rho < 5 around the cup's axis
  vec2 oc = ro.xz, dd = rd.xz; float A = dot(dd, dd), Bq = dot(oc, dd), Cq = dot(oc, oc) - 25.0, D = Bq * Bq - A * Cq;
  if (D <= 0.0) return vec4(0);
  float sq = sqrt(D); n0 = max(n0, (-Bq - sq) / A); n1 = min(n1, (-Bq + sq) / A);
  n1 = min(n1, tHit > 0.0 ? tHit : 1e3);
  if (n1 <= n0) return vec4(0);
  float steps = 32.0, dt = (n1 - n0) / steps;
  float ph = 0.5 + 0.5 * dot(rd, KEY);
  float phase = 0.25 + 1.6 * pow(ph, 6.0);           // bright toward the backlight
  for (float i = 0.0; i < 32.0; i++) {
    vec3 p = ro + rd * (n0 + (i + 0.5) * dt);
    float hy = p.y - (H - 0.3);
    float rad = length(p.xz - vec2(0.15 * sin(hy * 0.45), 0.0)) / (1.9 + hy * 0.22);
    float env = smoothstep(0.0, 0.9, hy) * exp(-hy / 4.2) * exp(-rad * rad * 2.4);
    if (env < 0.002) continue;
    float sw = 0.6 * sin(hy * 0.35 + 2.0 * PI * tau / LOOP);
    vec3 q = vec3(p.x * cos(sw) - p.z * sin(sw), p.y, p.x * sin(sw) + p.z * cos(sw));
    float n = fbmW(vec3(q.x * 0.9, q.y * 0.5 - tau * rise, q.z * 0.9), per);
    float fil = 1.0 - abs(2.0 * n - 1.0);                       // ridges: wisps, not fog
    float dens = pow(smoothstep(0.62, 0.97, fil), 2.5) * env * 0.75 * k;
    float a = 1.0 - exp(-dens * dt * 1.4);
    col += (1.0 - acc) * a * vec3(1.0, 0.88, 0.70) * phase * 1.3;
    acc += (1.0 - acc) * a;
  }
  return vec4(col, acc);
}

// ------------------------------------------------------------------ shading
vec3 shade(vec3 ro, vec3 rd, float t, float L, out float hitDist, int depth);
vec3 shadeHit(vec3 p, vec3 rd, float m, float t, float L) {
  vec3 n = normalAt(p, t, L), v = -rd;
  float occ = ao(p, n, t, L);
  float sk = softShadow(p + n * 0.01, KEY, t, L, 10.0), sf = softShadow(p + n * 0.01, FILL, t, L, 8.0);
  vec3 c;
  if (m < 1.5) {                                  // glazed white ceramic
    vec3 alb = vec3(0.86, 0.85, 0.83);
    float wrapK = max((dot(n, KEY) + 0.35) / 1.35, 0.0), wrapF = max((dot(n, FILL) + 0.2) / 1.2, 0.0);
    float inside = step(length(p.xz), rIn(p.y) + 0.06) * step(dot(n.xz, p.xz), 0.0) * step(YIN, p.y);
    c = alb * (KEYC * wrapK * mix(0.25, 1.0, sk) * 0.32 + FILLC * wrapF * sf + vec3(0.05, 0.048, 0.046) + vec3(0.20, 0.19, 0.18) * inside) * occ;
    vec3 F = fres(vec3(0.04), max(dot(n, v), 0.0));
    c += F * envR(reflect(rd, n), 0.7) * occ * 0.6;
    c += KEYC * ggx(n, v, KEY, 0.2) * sk * 0.3 + FILLC * ggx(n, v, FILL, 0.24) * sf * 0.35;
  } else if (m < 2.5) {                           // gold ring
    vec3 gold = vec3(0.96, 0.66, 0.24);
    vec3 F = fres(gold, max(dot(n, v), 0.0));
    vec3 r = reflect(rd, n);
    c = F * (env(r) * 0.9 + 0.04) * occ;
    c += gold * (KEYC * ggx(n, v, KEY, 0.25) * sk + FILLC * ggx(n, v, FILL, 0.3) * sf) * 0.6;
    c += gold * 0.06 * occ;
  } else if (m < 3.5) {                           // the coffee in the cup
    vec3 sn = surfNormal(p, t);
    vec3 alb = cremaColor(p, t, L);
    float dk = max(dot(sn, KEY), 0.0), df = max(dot(sn, FILL), 0.0);
    float wallShade = smoothstep(rIn(L) * 0.2, rIn(L), length(p.xz - vec2(0.4, -0.5)));   // the wall shades the far side
    c = alb * (KEYC * dk * 0.28 * mix(0.35, 1.0, sk) + FILLC * df * 0.6 * sf + 0.04) * mix(1.0, 0.6, wallShade) * occ;
    vec3 F = fres(vec3(0.03), max(dot(sn, v), 0.0));
    c += F * envR(reflect(rd, sn), cremaAmt(t)) * mix(1.0, 0.06, cremaAmt(t));
  } else {                                        // the stream: dark, glossy, amber where the light comes through
    vec3 F = fres(vec3(0.045), max(dot(n, v), 0.0));
    float tiger = 0.6 + 0.4 * smoothstep(0.3, 0.8, vnoise(vec3(p.y * 3.5 + t * 55.0, p.x * 9.0, 2.0)));
    float facing = max(dot(n, v), 0.0);
    vec3 amber = vec3(0.40, 0.16, 0.05) * tiger;
    c = vec3(0.022, 0.010, 0.004) + amber * 0.42 * facing * facing;
    c += F * env(reflect(rd, n)) * 0.9;
    c += KEYC * ggx(n, v, KEY, 0.07) * 0.25;
  }
  return c;
}

vec3 render(vec3 ro, vec3 rd, vec2 s, float t) {

      float F = 0.03 + 0.3 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
      if (h2.x > 0.0) c += shadeHit(p + rr * h2.x, rr, h2.y, t, L) * exp(-h2.x * 0.55) * F * nearK;

}

vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main() {
  vec2 frag = gl_FragCoord.xy + uJit;

  vec2 s = (frag - 0.5 * uRes) / uRes.y;            // y up, height 1
  // camera: 24 degrees above the counter, long lens; the cup is moved off centre with lens shift
  float elev = radians(24.0);
  float dist = uLayout == 0 ? 40.0 : 46.0;
  float vfov = uLayout == 0 ? radians(19.5) : radians(32.0);
  vec3 target = vec3(-0.35, 3.0, 0.0);

  vec2 shift = uLayout == 0 ? vec2(-0.12 * aspect, 0.05) : vec2(0.0, -0.14);
  vec2 q = s + shift;                                // where the cup sits on screen
  float f = 0.5 / tan(vfov * 0.5);
  vec3 rd = normalize(rt * q.x + up * q.y + fw * f);
  float t = shotT();
  if (uMode == 2) { float L = level(t); float tP = rd.y < 0.0 ? -ro.y / rd.y : -1.0; vec2 h = march(ro, rd, t, L, tP > 0.0 ? tP : 120.0);
    outC = vec4(render(ro, rd, s, t), h.x > 0.0 ? h.x : (tP > 0.0 ? tP : 1e3)); return; }
  vec3 c;
  if (uMode == 1) { vec4 b = texelFetch(uBase, ivec2(gl_FragCoord.xy), 0); vec4 st = steam(ro, rd, b.a, t); c = b.rgb * (1.0 - st.a) + st.rgb * 0.55; }
  else c = render(ro, rd, s, t);
  float expo = uMode == 0 ? smoothstep(0.0, 0.75, uT) : 1.0;   // the lights come up
  c *= expo * 1.15;
  c = aces(c);
  c = pow(c, vec3(1.0 / 2.2));
  c *= 1.0 - 0.28 * pow(length(s / vec2(aspect * 0.62, 0.62)), 2.2);
  outC = vec4(c, 1.0);
}

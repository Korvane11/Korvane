<!doctype html>
<!-- Eleven Cafē: the cà phê sữa đá moment, rendered offline frame by frame (see render_phin.cjs).
     A steel phin on a plain glass, coffee dripping onto condensed milk, on the same walnut counter in the same low amber
     window light as the opening (the room, the light, the haze and the lens below are copied from pour.html). The drops
     swell under the filter, fall and ring the surface; every cycle divides LOOP, so the clip loops without a seam.
     window.renderFrame(t, passes, w, h) -> PNG data URL, t in [0, LOOP). -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uT;        // seconds into the loop
uniform vec2 uJit;
uniform float uSeed;     // per pass: jitters the haze, the soft shadows and the steel's roughness
uniform vec3 uCam;       // the camera and what it looks at (cm), its vertical field of view (degrees), the lens shift
uniform vec3 uTarget;
uniform float uFov;
uniform vec2 uShift;
uniform float uSlice;    // the part of the shutter one pass covers (s): a falling drop is drawn as its streak in it
layout(location = 0) out vec4 outC;   // what lies behind the glass, or isn't behind it: linear rgb, alpha = depth (cm)
layout(location = 1) out vec4 outG;   // the glass's own light: laid over after the soft focus

// ------------------------------------------------------------------ noise
float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x), mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x), mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float fbm3(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
float ign(vec2 px) { return fract(52.9829189 * fract(dot(px, vec2(0.06711056, 0.00583715)))); }   // interleaved gradient noise

// ------------------------------------------------------------------ the drink (cm; the glass stands at the origin)
// a plain straight tumbler with a heavy base; condensed milk in the bottom, the coffee dripping onto it from a steel
// phin that sits on the rim. Everything that moves repeats every LOOP seconds.
const float LOOP = 4.0, G = 981.0, PI = 3.14159265;
const float HG = 9.0, WG = 0.20, BOT = 0.75;            // the glass: height, wall, solid base
float rG(float y) { return 3.05 + 0.04 * y; }            // outside radius: a slight taper, wider at the rim
float rI(float y) { return rG(y) - WG; }
const float M_TOP = 2.20, LV = 4.50;                     // the milk's top, the coffee's surface
const float PL = 4.70;                                   // the phin's plate, on the rim
const float RC = 3.45, CH = 5.10;                        // its chamber: radius, height
const float COLR = 2.95, COLH = 1.00;                    // the filter's foot, about 1 cm down into the glass; its floor under it
const float YF = HG - COLH;                              // the drips leave the floor here
const float Y0 = HG + 0.14, Y1 = Y0 + CH;                // the chamber's bottom and top
const float RL = 3.70;                                   // the lid

float smax(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (a - b) / k, 0.0, 1.0); return mix(b, a, h) + k * h * (1.0 - h); }
float smin(float a, float b, float k) { return -smax(-a, -b, k); }
float sdCyl(vec3 p, float r, float y0, float y1) {
  vec2 d = vec2(length(p.xz) - r, abs(p.y - 0.5 * (y0 + y1)) - 0.5 * (y1 - y0));
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
}

float sdEll(vec3 p, vec3 r) { float k0 = length(p / r), k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }

float sdGlass(vec3 p) {
  float r = length(p.xz);
  float outer = smax((r - rG(p.y)) * 0.9992, max(-p.y, p.y - HG), 0.06);
  float cav = smax(r - rI(p.y), BOT - p.y, 0.35);        // open at the top; the inside's bottom corner rounded
  return smax(outer, -cav, 0.05);                         // the rim comes out round
}

float sdPhin(vec3 p) {
  float plate = sdCyl(p, PL - 0.06, HG + 0.06, HG + 0.08) - 0.06;                       // 1.4 mm, its edge rolled
  float chamber = sdCyl(p, RC - 0.03, Y0, Y1) - 0.03;
  chamber = min(chamber, length(vec2(length(p.xz) - RC, p.y - Y1 + 0.02)) - 0.075);      // the rolled top edge
  float collar = sdCyl(p, COLR - 0.03, YF + 0.03, HG + 0.05) - 0.03;
  float lid = sdCyl(p, RL - 0.04, Y1 + 0.06, Y1 + 0.12) - 0.04;
  float knob = sdEll(p - vec3(0.0, Y1 + 0.16, 0.0), vec3(0.62, 0.42, 0.62));   // a small round knob
  float d = min(plate, collar);
  d = smin(d, chamber, 0.05);
  d = min(d, smin(lid, knob, 0.18));
  return d;
}

// the drips: three holes in the filter floor, each on its own cycle (all divide LOOP). A bead swells under the hole,
// lets go, falls (drawn as the streak it makes in one pass's slice of the shutter) and rings the surface.
// the floor is holes all over; these three are near its edge on the camera's side, where the beads show (from the
// camera's height the foot's own wall hides the middle of the floor)
const vec4 DR[3] = vec4[3](vec4(1.14, 2.06, 1.0, 0.10), vec4(2.06, 0.98, 1.3333333, 0.55), vec4(0.35, 2.36, 2.0, 1.40));   // x, z, period, phase
const float RB0 = 0.07, RB1 = 0.205;
float uDetach(float P) { return P - 0.17; }
float yDetach() { return YF - RB1 * 0.95; }
float tFall() { return sqrt(2.0 * (yDetach() - LV) / G); }
float sdCapsuleY(vec3 p, float ya, float yb, float r) { p.y -= clamp(p.y, min(ya, yb), max(ya, yb)); return length(p) - r; }
float sdDrips(vec3 p, float t) {
  float d = 1e3;
  for (int i = 0; i < 3; i++) {
    vec3 q = p - vec3(DR[i].x, 0.0, DR[i].y);
    if (dot(q.xz, q.xz) > 0.36) continue;
    float P = DR[i].z, u = mod(t - DR[i].w, P), ud = uDetach(P);
    // the bead under the hole (after a drop lets go, the next one starts small)
    float r = u < ud ? mix(RB0, RB1, pow(u / ud, 0.85)) : RB0;
    float bead = sdEll(q - vec3(0.0, YF - 0.82 * r, 0.0), vec3(r, 1.14 * r, r));
    d = min(d, smin(bead, YF - q.y, 0.06));   // grown out of the floor (the slab this adds above YF is cut below)
    // the falling drop
    float tau = u - ud;
    if (tau >= 0.0 && tau < tFall()) {
      float ya = yDetach() - 0.5 * G * tau * tau, tb = max(tau - 1.6 * uSlice, 0.0), yb = yDetach() - 0.5 * G * tb * tb;   // the slices overlap: one smooth streak
      d = min(d, sdCapsuleY(q, max(ya, LV), yb, 0.17));
    }
  }
  return max(d, p.y - YF - 0.02);      // nothing above the floor
}
// the surface: rings from each drop's landing, and a small bump where it lands
float ripple(vec2 xz, float t) {
  float h = 0.0;
  for (int i = 0; i < 3; i++) {
    float P = DR[i].z, land = uDetach(P) + tFall();
    float rho = length(xz - DR[i].xy);
    for (int k = 0; k < 2; k++) {
      float tau = mod(t - DR[i].w, P) - land + float(k) * P;
      if (tau <= 0.0 || tau > 1.6) continue;
      float front = 7.5 * tau, w = 0.22 + 0.45 * tau;
      h += 0.032 * exp(-2.4 * tau) * exp(-pow((rho - front) / w, 2.0)) * cos(16.0 * (rho - front)) * smoothstep(1.6, 1.1, tau);
      h += 0.11 * exp(-24.0 * tau) * exp(-rho * rho / 0.05);
    }
  }
  return h;
}
float meniscus(float r) { return 0.06 * exp(-(rI(LV) - r) / 0.09); }
float sdLiquid(vec3 p, float t) {
  float r = length(p.xz);
  float side = r - rI(p.y) + 0.004;
  float top = p.y - LV;
  if (abs(top) < 0.45) top -= ripple(p.xz, t) + meniscus(r);
  return max(max(side, BOT + 0.03 - p.y), top * 0.8);
}

bool gNoGlass = false;   // shadow, occlusion and reflection rays: the glass lets the light through
bool gNoLiquid = false;  // the light on the liquid itself: it doesn't shadow itself (see shade)
vec2 map(vec3 p, float t) {
  float b = max(length(p.xz) - 5.0, max(-p.y - 0.1, p.y - Y1 - 1.2));
  if (b > 0.4) return vec2(b, 0.0);
  vec2 r = vec2(1e3, 0.0);
  if (!gNoGlass) r = vec2(sdGlass(p), 1.0);
  float s = sdPhin(p); if (s < r.x) r = vec2(s, 2.0);
  if (!gNoLiquid) { float l = sdLiquid(p, t); if (l < r.x) r = vec2(l, 3.0); }
  if (length(p.xz) < 2.9 && p.y > LV - 0.4 && p.y < YF + 0.2) { float d = sdDrips(p, t) * 0.9; if (d < r.x) r = vec2(d, 4.0); }
  return r;
}
vec3 normalAt(vec3 p, float t) {
  vec2 e = vec2(0.0012, 0.0);
  return normalize(vec3(map(p + e.xyy, t).x - map(p - e.xyy, t).x, map(p + e.yxy, t).x - map(p - e.yxy, t).x, map(p + e.yyx, t).x - map(p - e.yyx, t).x));
}
vec2 march(vec3 ro, vec3 rd, float t, float tmax) {
  vec3 bmin = vec3(-5.2, -0.2, -5.2), bmax = vec3(5.2, Y1 + 1.4, 5.2);
  vec3 inv = 1.0 / rd, t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), max(tn.z, 0.0)), b = min(min(tf.x, tf.y), min(tf.z, tmax));
  if (a >= b) return vec2(-1.0, 0.0);
  float d = a;
  for (int i = 0; i < 220; i++) {
    vec2 h = map(ro + rd * d, t);
    if (h.x < 0.0006 * d) return vec2(d, h.y);
    d += h.x;
    if (d > b) break;
  }
  return vec2(-1.0, 0.0);
}
// soft shadow from the steel, the drips and (unless told not to) the liquid; the glass lets the sun through
float softShadow(vec3 ro, vec3 rd, float t, float k, float jit) {
  vec3 bmin = vec3(-5.2, -0.2, -5.2), bmax = vec3(5.2, Y1 + 1.4, 5.2);
  vec3 inv = 1.0 / rd, t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float a = max(max(tn.x, tn.y), max(tn.z, 0.0)), b = min(min(tf.x, tf.y), tf.z);
  if (a >= b) return 1.0;
  bool g = gNoGlass; gNoGlass = true;
  float res = 1.0, d = max(a, 0.02) + 0.02 * jit, ph = 1e10;
  for (int i = 0; i < 90; i++) {
    float h = map(ro + rd * d, t).x;
    float y = h * h / (2.0 * ph), e = sqrt(max(h * h - y * y, 0.0));
    res = min(res, k * e / max(d - y, 1e-4));
    ph = h;
    d += clamp(h, 0.015, 0.5) * (0.75 + 0.5 * fract(jit + float(i) * 0.618));
    if (res < 0.002 || d > b) break;
  }
  gNoGlass = g;
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n, float t) {
  float o = 0.0, s = 1.0;
  for (int i = 1; i <= 5; i++) { float h = 0.05 * float(i) * float(i); o += (h - map(p + n * h, t).x) * s; s *= 0.6; }
  return clamp(1.0 - 1.6 * o, 0.0, 1.0);
}

// ------------------------------------------------------------------ the room: window wall, counter, walls
const float XW = -26.0;          // the window wall's glass plane (the counter runs along it)
const float PD = 2.5;            // the posts' depth, into the room
const float SP = 40.7, PW = 17.0; // post spacing and width, along z: the cup in a beam, a post behind it
const float Z0 = -3.6;            // post phase: the cup sits in a band of sun
const float HEAD = 230.0;        // top of the glass; the counter is the sill
const float XR = 170.0, YC = 290.0, ZF = -420.0;   // right wall, ceiling, far wall
const vec3 SUN = normalize(vec3(-0.86, 0.34, -0.12));   // toward the sun: low, from the window's side
const vec3 SUNC = vec3(1.0, 0.63, 0.32) * 4.2;          // low, amber, golden
const vec3 GLASS = vec3(1.0, 0.46, 0.15) * 0.46;          // late light outside: a dim amber sky
const vec3 AMB = vec3(0.020, 0.013, 0.008);              // a dark room              // the room's warm bounce

float postMask(float z, float soft) {
  float u = mod(z - Z0, SP) - 0.5 * SP;
  return smoothstep(0.5 * PW + soft, 0.5 * PW - soft, abs(u));
}
// how much sun reaches p through the window (0..1), soft-edged by distance
float sunVis(vec3 p, float jit) {
  if (p.x <= XW) return 1.0;
  float s = (XW - p.x) / SUN.x;
  vec3 q = p + SUN * s;
  float soft = 0.35 + 0.014 * s;
  q.z += (jit - 0.5) * soft * 0.8;
  float win = smoothstep(-soft, soft, q.y) * smoothstep(HEAD + soft, HEAD - soft, q.y);
  return win * (1.0 - postMask(q.z, soft));
}
vec3 woodAlb(vec2 xz) {
  float pw = 10.5;
  float u = (xz.x - XW) / pw, k = floor(u), f = fract(u);
  float hk = hash1(k + 3.0);
  float z = xz.y + hk * 400.0;
  float grain = fbm3(vec3((xz.x - XW) * 0.55 + k * 7.0, z * 0.035, k * 1.7));
  float fine = vnoise(vec3((xz.x - XW) * 3.2 + k * 3.0, z * 0.25, 4.0));
  vec3 a = mix(vec3(0.26, 0.120, 0.050), vec3(0.40, 0.200, 0.090), hk);
  vec3 c = a * (0.72 + 0.50 * grain) * (0.92 + 0.12 * fine);
  float seam = smoothstep(0.0, 0.025, f) * smoothstep(1.0, 0.975, f);
  float e = fract(z / 160.0);
  seam *= smoothstep(0.0, 0.004, e) * smoothstep(1.0, 0.996, e);
  return c * mix(0.30, 1.0, seam);
}
// what a ray from o in direction d sees of the room (no cup): returns linear colour, writes the distance
vec3 room(vec3 o, vec3 d, float jit, out float dist, bool full);
vec3 windowSeen(vec3 o, vec3 d, out float dist) {
  // the posts' inner face, then the glass behind; a post's side if the ray crosses one in between
  float ti = (XW + PD - o.x) / d.x, tg = (XW - o.x) / d.x;
  vec3 pi = o + d * ti, pg = o + d * tg;
  dist = ti;
  if (pi.y > HEAD) return vec3(0.050, 0.034, 0.024);                 // the wall above the window
  if (postMask(pi.z, 0.15) > 0.5) return vec3(0.030, 0.012, 0.005);  // a post, facing the room: in shadow
  // a post's side, if the ray meets one between the posts' face and the glass
  float hw = 0.5 * PW / SP, ui = (pi.z - Z0) / SP - 0.5, ug = (pg.z - Z0) / SP - 0.5, sg = sign(ug - ui);
  float kb = sg > 0.0 ? floor(ui) + 1.0 : ceil(ui) - 1.0;
  float ub = kb - sg * hw;
  if ((ub - ui) * sg < abs(ug - ui)) {
    dist = mix(ti, tg, (ub - ui) / (ug - ui));
    return vec3(0.050, 0.020, 0.008) * (1.0 + 0.6 * smoothstep(0.0, 1.0, (ub - ui) / (ug - ui)));   // warmer toward the glass
  }
  dist = tg;
  if (pg.y > HEAD) return vec3(0.050, 0.034, 0.024);
  // outside: a bright morning, a soft hint of trees (out of focus anyway)
  float grad = 0.85 + 0.25 * smoothstep(0.0, HEAD, pg.y);
  float trees = fbm3(vec3(pg.z * 0.012, pg.y * 0.016, 3.0));
  return GLASS * grad * mix(vec3(1.0), vec3(0.80, 0.72, 0.52), smoothstep(0.45, 0.75, trees) * smoothstep(HEAD, 40.0, pg.y) * 0.55);
}
vec3 room(vec3 o, vec3 d, float jit, out float dist, bool full) {
  float best = 1e5; vec3 c = vec3(0);
  // counter (the floor of this little world), at y = 0, between the window and the right wall
  if (d.y < 0.0) {
    float tc = -o.y / d.y;
    vec3 p = o + d * tc;
    if (p.x > XW && tc < best) {
      best = tc;
      vec3 alb = woodAlb(p.xz);
      float sv = sunVis(p, jit);
      c = alb * (SUNC * sv * SUN.y + AMB * 1.3 + GLASS * 0.010 * smoothstep(60.0, 0.0, p.x - XW));
      if (full) {   // the varnish: a soft, warm reflection of the window
        float g = (fbm3(vec3(p.xz * 0.12, 7.0)) - 0.5) * 0.05;
        vec3 n = normalize(vec3(g, 1.0, g * 0.7));
        vec3 r = reflect(d, n);
        float F = 0.035 + 0.6 * pow(1.0 - max(dot(-d, n), 0.0), 5.0);
        float td; vec3 rc = r.x < 0.0 ? windowSeen(p, r, td) : vec3(0.06, 0.04, 0.028);
        c += rc * F * 0.20;
      }
    }
  }
  // the window wall
  if (d.x < 0.0) {
    float tw = (XW + PD - o.x) / d.x;
    if (tw > 0.0 && tw < best) {
      vec3 p = o + d * tw;
      if (p.y > 0.0 && p.y < YC) { float td; vec3 wc = windowSeen(o, d, td); best = td; c = wc; }
    }
  }
  // right wall, ceiling, far wall: plaster, with the sun's bands where they reach
  float tr = d.x > 0.0 ? (XR - o.x) / d.x : 1e5;
  float tcl = d.y > 0.0 ? (YC - o.y) / d.y : 1e5;
  float tf = d.z < 0.0 ? (ZF - o.z) / d.z : 1e5;
  float tb = d.z > 0.0 ? (260.0 - o.z) / d.z : 1e5;
  float tw2 = min(min(tr, tcl), min(tf, tb));
  if (tw2 < best) {
    best = tw2;
    vec3 p = o + d * tw2;
    vec3 n = tw2 == tr ? vec3(-1, 0, 0) : tw2 == tcl ? vec3(0, -1, 0) : tw2 == tf ? vec3(0, 0, 1) : vec3(0, 0, -1);
    vec3 alb = vec3(0.26, 0.20, 0.15);
    float sv = sunVis(p, jit);
    c = alb * (SUNC * sv * max(dot(n, SUN), 0.0) * 0.8 + AMB * 1.1);
  }
  dist = best;
  return c;
}
// the environment the glass and the steel reflect, seen from the middle of the drink
vec3 env(vec3 d) { float dd; return room(vec3(0.0, 7.0, 0.0), d, 0.5, dd, false); }

float ggx(vec3 n, vec3 v, vec3 l, float rough) {
  vec3 h = normalize(v + l); float a = rough * rough, a2 = a * a;
  float nh = max(dot(n, h), 0.0), nl = max(dot(n, l), 0.0), nv = max(dot(n, v), 0.001);
  float dd = nh * nh * (a2 - 1.0) + 1.0; float D = a2 / (PI * dd * dd);
  float k = (rough + 1.0) * (rough + 1.0) / 8.0; float Gs = (nl / (nl * (1.0 - k) + k)) * (nv / (nv * (1.0 - k) + k));
  return D * Gs / (4.0 * nv + 0.001);
}
vec3 fres(vec3 f0, float c) { return f0 + (1.0 - f0) * pow(1.0 - c, 5.0); }
// soft light on a surface from the room: the window to the left, the sunlit counter below, the room above
vec3 ambient(vec3 n) {
  vec3 wdir = normalize(vec3(-1.0, 0.35, -0.25));
  vec3 fdir = normalize(vec3(0.35, 0.25, 0.90));
  return GLASS * 0.05 * pow(max(dot(n, wdir) * 0.5 + 0.5, 0.0), 2.0)
       + vec3(0.60, 0.58, 0.55) * 0.20 * pow(max(dot(n, fdir) * 0.5 + 0.5, 0.0), 2.0)   // the room in front: keeps the white white
       + vec3(0.30, 0.17, 0.08) * 0.28 * max(-n.y * 0.5 + 0.5, 0.0)
       + AMB * (0.6 + 0.4 * n.y);
}

// ------------------------------------------------------------------ the haze: the sun's beams in the air
const float SIG = 0.00028;        // scattering per cm
vec3 haze(vec3 ro, vec3 rd, float tEnd, float jit) {
  float tE = min(tEnd, 900.0);
  float mu = dot(rd, SUN), g = 0.50;
  float ph = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * mu, 1.5);   // Henyey-Greenstein, x 4 pi
  float acc = 0.0, dt = tE / 28.0;
  for (int i = 0; i < 28; i++) acc += sunVis(ro + rd * ((float(i) + jit) * dt), jit);
  return (SUNC * ph * 0.33 * acc * dt + AMB * 1.5 * tE) * SIG;
}

// ------------------------------------------------------------------ the light through and on the drink
// the sun reaching a point, through what stands between: the steel and the drips (soft shadow), the liquid column
// (worked out exactly: the milk stops it, the coffee lets a little amber through where the path is short), the glass
vec3 sunThrough(vec3 p, vec3 sd, float t, float jit, bool liquidToo) {
  float s = softShadow(p, sd, t, 8.0, jit);
  vec3 T = vec3(s);
  if (liquidToo) {
    // the ray against the liquid's cylinder (radius at the coffee's middle; the taper is small)
    float R = rI(0.5 * (BOT + LV));
    vec2 o = p.xz, d = sd.xz;
    float a = dot(d, d), b = dot(o, d), c = dot(o, o) - R * R, disc = b * b - a * c;
    if (disc > 0.0 && a > 1e-6) {
      float q = sqrt(disc), t0 = max((-b - q) / a, 0.0), t1 = (-b + q) / a;
      if (t1 > 0.0) {

vec3 brushed(vec3 p, vec3 n) {

// what the coffee's surface mirrors: going up inside the glass, the phin's dark underside if the ray reaches the rim's

vec3 surfRefl(vec3 p, vec3 r) {

void render(vec3 ro, vec3 rd, float t, float jit, out vec4 behind, out vec3 glassAdd) {
  vec3 thr = vec3(1.0), o = ro, c = vec3(0.0);

    float rDist; vec3 bg = room(o, rd, jit, rDist, true);
    vec2 h = march(o, rd, t, rDist);
    if (h.x < 0.0) { c = counterNear(o + rd * rDist, rd, bg, t, jit); dist = travelled + rDist; break; }
    vec3 p = o + rd * h.x;

void main() {
  vec2 frag = gl_FragCoord.xy + uJit;

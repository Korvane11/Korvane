<!doctype html>
<!--
STYLE: Glassmorphism
LOOK: Frosted-glass panels floating over slow, saturated shapes on a deep ink backdrop; the shapes smear into soft colour behind the glass while their crisp edges stay visible around it.
TECHNIQUE: backdrop-filter: blur() saturate() on a barely-tinted translucent fill; a 1px gradient border drawn with a masked ::before (bright top-left, faint bottom-right) plus an inset top highlight; a long, soft, low-opacity drop shadow. Shapes move on slow Lissajous paths, cards parallax with the pointer at different depths (rAF, transforms only).
KNOBS: --blur (frost strength), --sat (colour boost through the glass), --tint (glass fill alpha), --edge (border brightness), --radius. JS: DRIFT (shape travel in px), SPEED (shape speed), PARALLAX (px per depth unit), TILT (deg of pointer tilt).
COST: backdrop-filter re-blurs whatever is behind each card every frame the background moves; cost scales with card area x blur radius. Fine for 2-4 cards; on phones keep --blur at 18-24px and avoid stacking glass on glass.
REDUCED MOTION: Shapes and cards hold a composed still; no drift, float or pointer parallax.
PITFALLS: Glass over a flat or slow-gradient background shows nothing; it needs crisp, colourful shapes behind it. A uniform white 1px border looks like a cheap outline; fade it with a gradient. Putting transform, filter or opacity on a parent of the glass makes that parent the backdrop root and the blur goes blank: keep motion on the cards themselves. Without backdrop-filter support the card must fall back to a solid, readable tint (@supports block).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassmorphism</title>
<style>
  :root {
    --bg: #0c0d1a;
    --blur: 26px; --sat: 170%;
    --tint: .10;                 /* glass fill alpha: .06-.16 reads as glass, more reads as plastic */
    --edge: .55;                 /* brightest point of the gradient border */
    --radius: 28px;
    --text: #f6f5ff; --muted: rgba(240, 238, 255, .72);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body { background: radial-gradient(120% 80% at 50% 0%, #1a1b35 0%, var(--bg) 60%); background-color: var(--bg);
    color: var(--text); font-family: var(--sans); overflow-x: hidden; }
  .bg { position: fixed; inset: 0; overflow: hidden; }
  .s { position: absolute; display: block; will-change: transform; }
  .s1 { width: clamp(220px, 34vmax, 560px); aspect-ratio: 1; border-radius: 50%; left: 8%; top: 6%;
    background: radial-gradient(circle at 32% 28%, #ffc29e, #ff7a5c 52%, #e0466a 100%); }
  .s2 { width: clamp(200px, 30vmax, 480px); aspect-ratio: 1; border-radius: 50%; right: 10%; top: 32%;
    background: linear-gradient(140deg, #a996ff, #5b3df5 70%);
    -webkit-mask: radial-gradient(farthest-side, transparent 58%, #000 59.5%); mask: radial-gradient(farthest-side, transparent 58%, #000 59.5%); }
  .s3 { width: clamp(140px, 19vmax, 300px); aspect-ratio: 1; border-radius: 30%; left: 34%; bottom: 4%;
    background: linear-gradient(160deg, #7ff0dc, #12a7a0 75%); }
  .s4 { width: clamp(180px, 26vmax, 420px); aspect-ratio: 2.6; border-radius: 999px; left: 52%; top: 4%;
    background: linear-gradient(90deg, #ff9ec7, #a78bfa); }
  main { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
  .stage { position: relative; width: min(600px, 100%); padding: 72px 0 92px; }
  .glass {
    position: relative; border-radius: var(--radius);
    background: linear-gradient(150deg, rgba(255, 255, 255, calc(var(--tint) + .06)), rgba(255, 255, 255, calc(var(--tint) - .04)));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)); backdrop-filter: blur(var(--blur)) saturate(var(--sat));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 30px 60px -24px rgba(4, 4, 20, .55), 0 2px 6px rgba(4, 4, 20, .12);
    will-change: transform;
  }
  /* 1px gradient border: bright top-left fading to faint, never to zero (no broken outline) */
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(140deg, rgba(255, 255, 255, var(--edge)), rgba(255, 255, 255, .10) 42%, rgba(255, 255, 255, .06) 70%, rgba(255, 255, 255, .22));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
    .glass { background: linear-gradient(150deg, rgba(52, 48, 92, .92), rgba(30, 28, 60, .94)); }
  }
  .card { padding: clamp(28px, 5vw, 48px); }
  .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 { margin-top: 14px; font-size: clamp(2.3rem, min(8.4vw, 9vh), 4.1rem); line-height: 1; letter-spacing: -.035em; font-weight: 650; }
  .lede { margin-top: 16px; max-width: 34ch; font-size: clamp(1rem, 1.3vw, 1.12rem); line-height: 1.5; color: var(--muted); }
  .row { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .btn { display: inline-block; padding: 13px 22px; border-radius: 999px; background: #fff; color: #17142e; font-weight: 600; font-size: 15px; text-decoration: none;
    box-shadow: 0 8px 24px -10px rgba(255, 255, 255, .6); }
  .row small { color: var(--muted); font-size: 13px; }
  .chip, .mini { position: absolute; display: flex; align-items: center; gap: 12px; }
  .chip { top: 22px; right: -36px; padding: 12px 16px 12px 12px; border-radius: 18px; font-size: 14px; }
  .mini { bottom: 18px; left: -52px; padding: 14px 18px; border-radius: 20px; }
  .dots { display: flex; }
  .dots i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .7); margin-left: -8px; }
  .dots i:first-child { margin-left: 0; background: linear-gradient(135deg, #ffc29e, #e0466a); }
  .dots i:nth-child(2) { background: linear-gradient(135deg, #a996ff, #5b3df5); }
  .dots i:nth-child(3) { background: linear-gradient(135deg, #7ff0dc, #12a7a0); }
  .chip b, .mini b { font-weight: 600; display: block; }
  .chip span, .mini span { color: var(--muted); font-size: 12px; }
  .ring { width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: conic-gradient(#fff 0 68%, rgba(255, 255, 255, .18) 0); -webkit-mask: radial-gradient(farthest-side, transparent 68%, #000 70%); mask: radial-gradient(farthest-side, transparent 68%, #000 70%); }
  .mini b { font-size: 20px; letter-spacing: -.02em; }
  @media (max-width: 700px) {
    .chip { right: 10px; top: 26px; }
    .mini { left: 10px; bottom: 26px; }
  }
  @media (max-height: 520px) and (orientation: landscape) {   /* phone landscape: everything in one screen */
    .stage { padding: 22px 0 26px; } .card { padding: 22px 30px; } h1 br { display: none; }
    .lede { max-width: 46ch; margin-top: 10px; } .row { margin-top: 16px; }
    .chip { top: 0; right: -28px; } .mini { left: auto; right: -34px; bottom: 6px; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="s s1"></i><i class="s s2"></i><i class="s s3"></i><i class="s s4"></i></div>
<main>
  <div class="stage">
    <section class="glass card" data-depth="0.5">
      <p class="eyebrow">Studio workspace</p>
      <h1>Clarity,<br> in layers.</h1>
      <p class="lede">Briefs, files and feedback in one calm place, so nothing gets lost between drafts.</p>
      <div class="row"><a class="btn" href="#">Start for free</a><small>No card needed</small></div>
    </section>
    <aside class="glass chip" data-depth="1.4"><span class="dots"><i></i><i></i><i></i></span><div><b>3 reviews waiting</b><span>Updated just now</span></div></aside>
    <aside class="glass mini" data-depth="2.2"><span class="ring"></span><div><span>Focus today</span><b>4h 48m</b></div></aside>
  </div>
</main>
<script>
(() => {
  const DRIFT = 70, SPEED = 0.05, PARALLAX = 12, TILT = 4;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shapes = [...document.querySelectorAll('.s')];
  const cards = [...document.querySelectorAll('.glass')];
  // each shape: x/y frequency, phase, base rotation, spin
  const paths = [[1.0, 0.8, 0.0, 0, 0], [0.7, 1.1, 2.1, 0, 0], [1.3, 0.9, 4.0, 12, 6], [0.9, 1.2, 1.2, -14, -4]];
  let px = 0, py = 0, tx = 0, ty = 0, last = 0;
  const t0 = performance.now();
  addEventListener('pointermove', e => { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; });

  function frame(now) {
    const t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
    const k = 1 - Math.exp(-dt * 3);                     // pointer easing, frame-rate independent
    px += (tx - px) * k; py += (ty - py) * k;
    const a = t * SPEED * Math.PI * 2;
    shapes.forEach((s, i) => {
      const [fx, fy, ph, rot, spin] = paths[i];
      s.style.transform = `translate3d(${Math.sin(a * fx + ph) * DRIFT}px, ${Math.cos(a * fy + ph) * DRIFT}px, 0) rotate(${rot + Math.sin(a + ph) * spin}deg)`;
    });
    const intro = Math.min(1, t / 1.1), e = 1 - Math.pow(1 - intro, 3);  // ease-out entrance
    cards.forEach((c, i) => {
      const d = +c.dataset.depth, float = Math.sin(t * 0.9 + i * 1.7) * 3 * d;
      const x = px * PARALLAX * d, y = py * PARALLAX * d + float + (1 - e) * (30 + i * 16);
      c.style.transform = `perspective(900px) translate3d(${x}px, ${y}px, 0) rotateX(${-py * TILT}deg) rotateY(${px * TILT}deg)`;
      c.style.opacity = Math.min(1, e * 1.4 - i * 0.12).toFixed(3);
    });
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);
  else shapes.forEach((s, i) => { const [, , ph, rot] = paths[i]; s.style.transform = `translate3d(${Math.sin(ph) * DRIFT}px, ${Math.cos(ph) * DRIFT}px, 0) rotate(${rot}deg)`; });
})();
</script>
</body>
</html>

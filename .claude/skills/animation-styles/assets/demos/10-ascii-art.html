<!doctype html>
<!--
STYLE: ASCII art
LOOK: A torus turning in plain monospaced characters, phosphor green on near-black with a faint glow, beside a crisp mono headline and a prompt line. Add ?paper (or class "paper" on <html>) for ink on paper.
TECHNIQUE: Every character cell is a pixel. Per cell, cast a ray, clip it to a bounding sphere, sphere-trace the torus distance field, light the hit with diffuse + a small specular, and map brightness onto the ramp " .:-=+*#%@" (any hit gets at least "."). Rotation is applied to the ray, not the shape (one 3x3 per frame). The whole frame is written as one string into a <pre> with line-height 1; cell width is measured, so aspect stays correct.
KNOBS: --fg / --bg / --glow / --head / --head-glow (colours), RAMP (dark to bright), R / TUBE (torus radii), SPIN_A / SPIN_B (rad/s on two axes), LIGHT (light direction), SPEC (highlight strength), FADE_MS (intro: the shape densifies from dots), FONT_MIN / FONT_MAX (cell size range in px).
COST: CPU only: about cols x rows rays per frame (~12k on desktop, ~8k on phones), but the bounding sphere skips most of them and hits take ~10-20 steps. Text layout of one <pre> per frame is cheap; the glow (text-shadow) is the paint cost, so drop --glow on weak devices.
REDUCED MOTION: One fully lit frame at a three-quarter angle; no rotation, no fade.
PITFALLS: Forgetting the cell aspect (characters are ~0.6 as wide as tall) squashes the shape; measure cell width and project in CSS pixels. A neon glow on every glyph plus scanlines and flicker is the tacky version: one soft text-shadow, no blinking cursor. Too fine a grid stops reading as type: keep cells at 8 px or more. Overlaying the headline on the art kills legibility: keep the art in its own region and set the headline in the same mono family, larger and brighter.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Art</title>
<style>
  :root {
    --bg: #050806; --bg-hi: #0c1711;
    --fg: #8eeaa8; --head: #e3fbe9; --dim: rgba(142, 234, 168, .58);
    --glow: rgba(70, 230, 130, .38);        /* one soft halo; set to transparent for a flat print look */
    --head-glow: rgba(70, 230, 130, .2);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  html.paper { --bg: #efebe1; --bg-hi: #f8f5ee; --fg: #23211d; --head: #121110; --dim: rgba(35, 33, 29, .62); --glow: transparent; --head-glow: transparent; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { overflow: hidden; background: radial-gradient(70% 70% at 66% 46%, var(--bg-hi), var(--bg) 75%); background-color: var(--bg);
    color: var(--fg); font-family: var(--mono); }
  pre { position: fixed; inset: 0; font-family: var(--mono); line-height: 1; white-space: pre; overflow: hidden;
    color: var(--fg); text-shadow: 0 0 .55em var(--glow); user-select: none; }
  .bar { position: fixed; top: clamp(14px, 3vh, 28px); left: clamp(16px, 5vw, 72px); right: clamp(16px, 5vw, 72px);
    display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .08em; color: var(--dim); }
  .copy { position: fixed; left: clamp(16px, 6vw, 96px); right: 16px; bottom: clamp(24px, 7vh, 72px); max-width: 36rem; }
  h1 { font-size: clamp(1.9rem, min(7.4vw, 7vh), 3.9rem); line-height: 1.04; letter-spacing: -.03em; font-weight: 700; color: var(--head);
    text-shadow: 0 0 18px var(--head-glow); }
  .copy p { margin-top: 16px; max-width: 34ch; font-size: clamp(.9rem, 1.1vw, 1rem); line-height: 1.6; color: var(--dim); }
  .copy .cmd { margin-top: 22px; color: var(--fg); }
  .cmd b { color: var(--dim); font-weight: 400; margin-right: .6em; }
  .cmd i { display: inline-block; width: .6em; height: 1.1em; margin-left: .3em; vertical-align: -.2em; background: var(--fg); opacity: .8; }
  @media (min-width: 720px) and (orientation: landscape) { .copy { top: 50%; bottom: auto; transform: translateY(-50%); max-width: min(36rem, 40vw); } }
</style>
</head>
<body>
<pre id="art" aria-hidden="true"></pre>
<div class="bar"><span>~/ship</span><span id="dims"></span></div>
<main class="copy">
  <h1>Ship from the<br>command line.</h1>
  <p>Fast, scriptable deploys for teams who live in the terminal.</p>
  <p class="cmd"><b>$</b>ship deploy --prod<i></i></p>
</main>
<script>
(() => {
  const RAMP = ' .:-=+*#%@';
  const R = 1, TUBE = 0.44, SPIN_A = 0.55, SPIN_B = 0.31, SPEC = 0.35, FADE_MS = 1300, FONT_MIN = 8, FONT_MAX = 13;
  const LIGHT = norm([-0.55, 0.7, -0.55]);                        // upper left, toward the viewer
  const D = 5, BOUND = R + TUBE + 0.02;                            // camera distance, bounding sphere
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (/[?&]paper/.test(location.search)) document.documentElement.classList.add('paper');
  const pre = document.getElementById('art'), dims = document.getElementById('dims');
  function norm(v) { const l = Math.hypot(...v); return v.map(x => x / l); }

  let cols, rows, cw, ch, cx, cy, k;
  function layout() {
    const w = innerWidth, h = innerHeight;
    const fs = Math.max(FONT_MIN, Math.min(FONT_MAX, Math.round(Math.min(w, h * 1.6) / 105)));
    pre.style.fontSize = fs + 'px';
    const probe = document.createElement('span'); probe.textContent = 'M'.repeat(100); pre.textContent = ''; pre.appendChild(probe);
    cw = probe.getBoundingClientRect().width / 100; ch = fs; probe.remove();   // measured cell: aspect stays true
    cols = Math.floor(w / cw); rows = Math.floor(h / ch);
    const wide = w >= 720 && w > h;
    cx = wide ? w * 0.67 : w * 0.5; cy = wide ? h * 0.5 : h * 0.38;
    const radius = wide ? Math.min(h * 0.4, w * 0.25) : Math.min(w * 0.46, h * 0.25);   // torus radius on screen, px
    k = BOUND / D / radius;                                         // px -> ray slope
    dims.textContent = `${cols}×${rows}`;
    if (reduce) draw(0);
  }

  function draw(now) {
    const t = reduce ? 0 : now / 1000, A = 1.0 + t * SPIN_A, B = 0.5 + t * SPIN_B;
    const fade = reduce ? 1 : Math.min(1, now / FADE_MS), f = 1 - Math.pow(1 - fade, 3);
    const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
    // world -> torus space: Rz(-B) then Rx(-A); rotate the rays, not the torus
    const loc = (x, y, z) => { const x1 = x * cB + y * sB, y1 = -x * sB + y * cB; return [x1, y1 * cA + z * sA, -y1 * sA + z * cA]; };
    const ex = loc(1, 0, 0), ey = loc(0, 1, 0), ez = loc(0, 0, 1), ro = loc(0, 0, -D);
    const Ll = loc(...LIGHT), H = loc(...norm([LIGHT[0], LIGHT[1], LIGHT[2] - 1]));
    const roro = ro[0] * ro[0] + ro[1] * ro[1] + ro[2] * ro[2] - BOUND * BOUND;
    let out = '';
    for (let j = 0; j < rows; j++) {
      const v = -((j + 0.5) * ch - cy) * k;
      for (let i = 0; i < cols; i++) {
        const u = ((i + 0.5) * cw - cx) * k;
        let dx = u * ex[0] + v * ey[0] + ez[0], dy = u * ex[1] + v * ey[1] + ez[1], dz = u * ex[2] + v * ey[2] + ez[2];
        const dl = Math.hypot(dx, dy, dz); dx /= dl; dy /= dl; dz /= dl;
        const b = ro[0] * dx + ro[1] * dy + ro[2] * dz, disc = b * b - roro;
        if (disc < 0) { out += ' '; continue; }                     // misses the bounding sphere: most cells stop here
        let tt = -b - Math.sqrt(disc), tEnd = -b + Math.sqrt(disc), hit = false, x, y, z;
        for (let s = 0; s < 32 && tt < tEnd; s++) {
          x = ro[0] + dx * tt; y = ro[1] + dy * tt; z = ro[2] + dz * tt;
          const q = Math.hypot(x, z) - R, d = Math.hypot(q, y) - TUBE;
          if (d < 0.004) { hit = true; break; }
          tt += d;
        }
        if (!hit) { out += ' '; continue; }
        const lx = Math.hypot(x, z) || 1, nx = (x - x / lx * R) / TUBE, ny = y / TUBE, nz = (z - z / lx * R) / TUBE;
        const dif = Math.max(0, nx * Ll[0] + ny * Ll[1] + nz * Ll[2]);
        const spec = Math.pow(Math.max(0, nx * H[0] + ny * H[1] + nz * H[2]), 24) * SPEC;
        const lum = Math.min(1, 0.05 + 0.68 * dif + spec) * f;       // diffuse tops out below '@': only highlights hit the end of the ramp
        out += RAMP[1 + Math.min(8, (lum * 9) | 0)];
      }
      out += '\n';
    }
    pre.textContent = out;
  }

  function loop(now) { draw(now); requestAnimationFrame(loop); }
  addEventListener('resize', layout);
  layout();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | SimNow</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for any address under the site that doesn't exist, at that address,
       so every link here resolves from the site's folder. Change it with the domain (CLAUDE.md). -->
  <base href="/Korvane/sites/simnow/">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#030304">
  <style>
    @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-display: swap; src: url("assets/fonts/barlow-condensed-latin-800-normal.woff2") format("woff2"); }
    @font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url("assets/fonts/barlow-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url("assets/fonts/barlow-latin-600-normal.woff2") format("woff2"); }
    :root {
      --brand: #d0312c; --brand-light: #f0605a; --brand-glow: rgba(208, 49, 44, 0.45);
      --black: #030304; --hair-strong: rgba(255, 255, 255, 0.16);
      --text: #f4f5f7; --text-soft: #c9ccd2; --text-muted: #9a9ea6;
      --gutter: clamp(20px, 4.5vw, 64px);
      --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
      background: var(--black); color: var(--text);
      font: 400 1rem/1.6 "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* the night drive's poster frame, dimmed, with the tail lights still glowing through */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        linear-gradient(90deg, rgba(3, 3, 4, 0.94) 0%, rgba(3, 3, 4, 0.7) 45%, rgba(3, 3, 4, 0.35) 100%),
        linear-gradient(0deg, var(--black) 0%, transparent 40%),
        url("assets/drive/poster.webp") 70% 40% / cover no-repeat;
    }
    header, main, footer { padding: 0 var(--gutter); }
    header { padding-top: 28px; }
    header img { display: block; height: 24px; width: auto; }
    main { align-self: center; max-width: 760px; padding-top: 40px; padding-bottom: 40px; }
    .eyebrow { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text-muted); }
    .eyebrow::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 12px; border-radius: 50%; background: var(--brand); vertical-align: 2px; }
    h1 {
      margin: 18px 0 0; font: 800 clamp(3.6rem, 13vw, 8rem)/0.9 "Barlow Condensed", "Arial Narrow", sans-serif;
      letter-spacing: -0.01em; text-transform: uppercase;
    }
    h1 span { color: var(--brand); }
    p.lead { margin: 22px 0 0; max-width: 34ch; font-size: 1.1rem; color: var(--text-soft); }
    .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .btn {
      display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 6px 6px 26px;
      border-radius: 999px; font: 600 0.92rem/1 "Barlow", system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text); text-decoration: none; transition: transform 500ms var(--ease-spring), background-color 300ms;
    }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid var(--brand-light); outline-offset: 3px; }
    .btn--primary { background: var(--brand); box-shadow: 0 10px 40px -12px var(--brand-glow), inset 0 1px 0 rgba(255, 255, 255, 0.18); }
    .btn--primary:hover { background: #dc3a35; }
    .btn--ghost { padding-right: 26px; background: rgba(255, 255, 255, 0.04); box-shadow: inset 0 0 0 1px var(--hair-strong); }
    .btn--ghost:hover { background: rgba(255, 255, 255, 0.09); }
    .btn__icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.18); }
    .btn__icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    footer { padding-bottom: 28px; font-size: 0.9rem; color: var(--text-muted); }
    footer a { color: var(--text-soft); }
  </style>
</head>
<body>
  <header>
    <a href="./" aria-label="SimNow home"><img src="assets/simnow-wordmark.svg" alt="SimNow" width="540" height="91"></a>
  </header>
  <main>
    <p class="eyebrow">Page not found</p>
    <h1>Off <span>track.</span></h1>
    <p class="lead">We couldn't find that page. It may have moved, or the link has a typo.</p>
    <div class="ctas">
      <a class="btn btn--primary" href="./"><span>Back to SimNow</span><span class="btn__icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M5 11 11 5M6 5h5v5"/></svg></span></a>
      <a class="btn btn--ghost" href="https://simnowusa.com/book#booking">Book a session</a>
    </div>
  </main>
  <footer>
    Questions? Call or text <a href="tel:+19713452568">971-345-2568</a>.
  </footer>
</body>
</html>
